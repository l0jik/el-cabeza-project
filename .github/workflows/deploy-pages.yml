name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/artifact-code-update-u6amyw
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The fast Node checks (rules, AI, shapes, saved story; seconds):
      # nothing ships if the engine is broken. (The browser tests take
      # too long for every push: npm run test:e2e.)
      - run: npm run test:engine
      - run: npm run build
      - name: Add landing page
        run: |
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex, nofollow">
            <title>El Cabeza</title>
            <style>
              body { font-family: system-ui, sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; gap: 1.5rem; }
              a { color: #7cf; font-size: 1.4rem; text-decoration: none; padding: 0.75rem 1.5rem; border: 1px solid #7cf; border-radius: 8px; }
              a:hover { background: #7cf; color: #111; }
            </style>
          </head>
          <body>
            <h1>El Cabeza</h1>
            <a href="el-cabeza-standard.html">Standard</a>
            <a href="el-cabeza-futuris.html">Futuris</a>
            <a href="el-cabeza-cromo.html">Cromo</a>
            <a href="el-cabeza-luna.html">Luna</a>
            <a href="el-cabeza-ciudad.html">Ciudad</a>
            <a href="el-cabeza-lluvia.html">Lluvia</a>
            <a href="el-cabeza-nova.html">Nova</a>
            <a href="el-cabeza-tienda.html">Tienda</a>
            <a href="el-cabeza-parrish.html?look=orinoco">Parrish (Orinoco)</a>
            <a href="el-cabeza-parrish.html?look=watermark">Parrish (Watermark)</a>
            <a href="el-cabeza-lab.html">Theme Lab</a>
            <a href="el-cabeza.apk">Android app</a>
          </body>
          </html>
          EOF
      - name: Add robots.txt
        run: |
          cat > dist/robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF
      # (The site, for the Android app's build and for Pages.)
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

  # The game as an Android app (user: "create the app version to have on
  # this phone."): Capacitor's project in android/, the site's files as the
  # app ships them (tools/app_www.mjs), built here where the Android SDK is
  # (GitHub's machines have it), and put beside the site as el-cabeza.apk.
  # Its version: the game's (APP_VERSION) and this workflow's run number, so
  # each new APK installs over the last.
  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - run: node tools/app_www.mjs
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build the APK
        working-directory: android
        run: |
          VERSION=$(grep -o 'APP_VERSION = "[0-9.]*"' ../chassis/ElCabeza3D.jsx | grep -o '[0-9][0-9.]*')
          ./gradlew --no-daemon assembleRelease -PappVersionName="$VERSION" -PappVersionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../el-cabeza.apk
      - name: What it is
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT"/aapt2 dump badging el-cabeza.apk | grep -E "^package|sdkVersion|application-label:" || true
          "$BT"/apksigner verify --print-certs el-cabeza.apk | head -4
          ls -l el-cabeza.apk
      # Its version, beside it on the site: the app's title screen asks
      # for it and says when a newer one's out (apps/title-screen.js).
      - name: The app's version, for its update note
        env:
          CODE: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          node -e '
            const fs = require("fs");
            const name = (fs.readFileSync("chassis/ElCabeza3D.jsx", "utf8").match(/APP_VERSION = "([0-9.]+)"/) || [])[1] || "";
            const info = { versionCode: Number(process.env.CODE), versionName: name, commit: process.env.SHA.slice(0, 7),
              built: new Date().toISOString(), size: fs.statSync("el-cabeza.apk").size, apk: "el-cabeza.apk" };
            fs.writeFileSync("el-cabeza-app.json", JSON.stringify(info) + "\n");
            console.log(JSON.stringify(info));'
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            el-cabeza.apk
            el-cabeza-app.json
          retention-days: 7

  # The APK on an Android emulator: installed, opened, given half a minute;
  # what the game's pages said (Capacitor/Console), what's on its screen,
  # whether it's still running. It reports; it doesn't hold up the deploy.
  android-check:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # (Each line its own command. The app opened with the phone's
          # network off: it carries everything it needs, its fonts too.)
          script: |
            adb install -r el-cabeza.apk
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell cmd connectivity airplane-mode enable || true
            sleep 5
            adb shell ping -c 1 -W 3 8.8.8.8 > /dev/null 2>&1 && echo "NETWORK STILL UP" || echo "NO NETWORK"
            adb logcat -c
            adb shell am start -W -n io.github.l0jik.elcabeza/.MainActivity
            sleep 45
            adb shell pidof io.github.l0jik.elcabeza && echo "APP RUNNING" || echo "APP NOT RUNNING"
            echo "OFFLINE: anything the pages failed to load or were refused (none expected):"
            adb logcat -d -v brief | grep -E "net::ERR|Failed to load resource|Refused to" | head -20 || true
            echo "OFFLINE: fonts the pages took from the app's own copy:"
            adb logcat -d -v brief | grep -c "localhost/fonts/" || true
            adb logcat -d -v brief | grep -oE "localhost/fonts/[^ ?]+" | sort -u | head -12 || true
            adb logcat -d -v time | grep -E "Capacitor|AndroidRuntime|FATAL|ElCabeza" | grep -v "Handling local request" | tail -80 || true
            adb logcat -d -v time | grep -E "ActivityTaskManager|ActivityManager|WindowManager" | grep -iE "elcabeza" | tail -40 || true
            adb logcat -d -v brief | grep -c "Handling local request" || true
            adb shell uiautomator dump /sdcard/ui.xml || true
            adb pull /sdcard/ui.xml ui.xml || true
            grep -o 'text="[^"]*"' ui.xml | grep -v 'text=""' | head -40 || true
            adb exec-out screencap -p > app-screen.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screen
          path: |
            app-screen.png
            ui.xml
          retention-days: 7

  # The site and, if it was built, the app beside it.
  pages:
    needs: [build, android]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: apk
          path: dist
      - run: ls -l dist/el-cabeza.apk || echo "(no app this time)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
