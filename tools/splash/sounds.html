<!doctype html>
<!-- The title screen's sounds, rendered offline in the browser with the
     game's own wooden knocks (themes/wood-sfx.js): window.SOUNDS.render(plan)
     -> 16-bit stereo PCM, base64. Driven by tools/splash/sounds.mjs. -->
<html>
<head><meta charset="utf-8"></head>
<body>
<script type="module">
import { createWoodSfx, landingSize } from "../../themes/wood-sfx.js";

/* An airy room: two channels of decaying noise, a little apart, the lows
   drawn off it (the knocks' "rarefied" space: light, high, far). */
function room(ctx, secs, decay) {
  const len = Math.floor(ctx.sampleRate * secs), b = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch); let lp = 0;
    for (let i = 0; i < len; i++) { lp = lp * 0.55 + (Math.random() * 2 - 1) * 0.45; d[i] = lp * Math.pow(1 - i / len, decay); }
  }
  return b;
}

/* plan: { secs, knocks: [{ at, kind, units, contact, pan, level, send }], room: { secs, decay, send, ghost }, board }
   A knock is the game's landing (its size from the face it lands on and
   its cubes, its level from its cubes) through: the dry path (thinned,
   brightened a touch) and a send to the room; and its ghost an octave up
   (a quarter the size), into the room only. A Cabeza never knocks in the
   game (it slides, chassis): a soft brush of wood on wood instead. */
async function render(plan) {
  const SR = 48000, ctx = new OfflineAudioContext(2, Math.ceil(SR * plan.secs), SR);
  const dry = ctx.createGain(); dry.gain.value = plan.dry ?? 0.6;
  const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 110; hp.Q.value = 0.6;
  const air = ctx.createBiquadFilter(); air.type = "highshelf"; air.frequency.value = 3200; air.gain.value = 4;
  dry.connect(hp).connect(air).connect(ctx.destination);
  const send = ctx.createGain(); send.gain.value = 1;
  const cv = ctx.createConvolver(); cv.buffer = room(ctx, plan.room.secs, plan.room.decay);
  const whp = ctx.createBiquadFilter(); whp.type = "highpass"; whp.frequency.value = 420; whp.Q.value = 0.5;
  const wet = ctx.createGain(); wet.gain.value = plan.room.wet;
  send.connect(cv).connect(whp).connect(wet).connect(ctx.destination);
  for (const k of plan.knocks) {
    const pan = ctx.createStereoPanner(); pan.pan.value = k.pan || 0;
    // (send: this knock's share of the room, more for one further off)
    const toRoom = ctx.createGain(); toRoom.gain.value = plan.room.send * (k.send ?? 1);
    pan.connect(dry); pan.connect(toRoom).connect(send);
    if (k.kind === "cabeza") {
      // the brush: a short band of noise, swelling and gone
      const n = ctx.createBufferSource(), nb = ctx.createBuffer(1, SR, SR), nd = nb.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      n.buffer = nb;
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 0.9;
      const g = ctx.createGain(), t0 = Math.max(0, k.at - 0.22);
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.035 * (k.level ?? 1), t0 + 0.16); g.gain.linearRampToValueAtTime(0, k.at + 0.06);
      n.connect(bp).connect(g).connect(pan); n.start(t0); n.stop(k.at + 0.1);
      continue;
    }
    const units = k.units || 1, m = Math.max(1, Math.min(8, units));
    const wood = createWoodSfx(ctx, pan, { board: plan.board || "solid" });
    const level = (0.09 + 0.03 * Math.log2(m)) * (k.level ?? 1);
    const size = landingSize(units, k.contact);
    wood.hit(k.at, { size, level, bright: 1.08, board: 1 });
    // the ghost, an octave up, heard only in the room
    const ghostOut = ctx.createGain(); ghostOut.gain.value = plan.room.ghost; ghostOut.connect(send);
    createWoodSfx(ctx, ghostOut, { board: plan.board || "solid" }).hit(k.at + 0.012, { size: size / 4, level, bright: 1.15, board: 0 });
  }
  const out = await ctx.startRendering();
  const L = out.getChannelData(0), R = out.getChannelData(1);
  let peak = 0;
  for (let i = 0; i < L.length; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  const k = plan.peak ? plan.peak / (peak || 1) : 1;
  const pcm = new Int16Array(L.length * 2);
  for (let i = 0; i < L.length; i++) { pcm[2 * i] = Math.max(-1, Math.min(1, L[i] * k)) * 32767; pcm[2 * i + 1] = Math.max(-1, Math.min(1, R[i] * k)) * 32767; }
  let bin = "";
  const u8 = new Uint8Array(pcm.buffer);
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return { rate: SR, peak, gain: k, data: btoa(bin) };
}
window.SOUNDS = { render, ready: true };
</script>
</body>
</html>
