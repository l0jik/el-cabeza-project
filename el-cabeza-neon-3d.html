      el.removeEventListener("wheel", onWheel);
      el.removeEventListener("contextmenu", onContextMenu);
    };
  }, [pieces, currentPlayer, turnLocked, activePiece, busy, isPlaying, beginMove, aiPlayer, awaitingBegin]);

  /* --------------------------- actions --------------------------- */
  function snapToCenter() {
    cam.current.target.set(0, 0, 0);
    cam.current.view.target.set(0, 0, 0);
  }

  function recenterView() {
    cam.current.theta = currentPlayer === "dark" ? Math.PI : 0;
    cam.current.phi = 0.86;
    cam.current.radius = 17;
    snapToCenter();
  }

  function topDownView(facePlayer = currentPlayer) {
    cam.current.theta = facePlayer === "dark" ? Math.PI : 0;
    cam.current.phi = 0.012;
    const ZOOM_PCT = 0.7;
    cam.current.radius = ZOOM_MAX - ZOOM_PCT * (ZOOM_MAX - ZOOM_MIN);
    snapToCenter();
  }

  function handleStopHere() {
    if (!selectedPiece || stepsUsed === 0 || busy || anim.current || currentPlayer === aiPlayer || awaitingBegin) return;
    settleTurn(selectedPiece, pendingNotation);
  }
  function handleUndoTurn() {
    if (!turnSnapshot || busy || anim.current || currentPlayer === aiPlayer || awaitingBegin) return;

    const restore = () => {
      setPieces(turnSnapshot);
      setStepsUsed(0);
      setTurnSnapshot(null);
      setPendingNotation([]);
      setSelectedId(null);
      setHoveredId(null);
      setHoverShadow(null);
      setBusy(false);
    };

    const moving = pieces.find((p) => p.id === selectedId);
    if (!moving || pendingNotation.length === 0) {
      restore();
      return;
    }

    const t = three.current;
    setBusy(true);
    while (t.ghostGroup.children.length) t.ghostGroup.children.pop();
    setHoverShadow(null);

    const steps = [...pendingNotation].reverse().map((d) => INVERSE_DIR[d]);

    const run = (i, state) => {
      if (i >= steps.length) {
        restore();
        return;
      }
      const dir = steps[i];
      animateStep(state, dir, () => {
        const next =
          PIECE_META[state.type].shape === "disc"
            ? {
                ...state,
                row: state.row + STEP_DIRS[dir][0],
                col: state.col + STEP_DIRS[dir][1],
              }
            : rollBlock(state, dir);
        run(i + 1, next);
      });
    };

    run(0, moving);
  }
  function handleUndoLastTurn() {
    if (turnHistory.length === 0 || busy || aiThinking || turnLocked || anim.current || awaitingBegin) return;

    const stack = [...turnHistory];
    const batch = [];
    while (stack.length > 0) {
      const entry = stack.pop();
      batch.push(entry);
      if (aiPlayer === null || entry.currentPlayer !== aiPlayer) break;
    }
    if (batch.length === 0) return;
    const target = batch[batch.length - 1];

    const t = three.current;
    setBusy(true);
    setSelectedId(null);
    setHoveredId(null);
    setHoverShadow(null);
    while (t.ghostGroup.children.length) t.ghostGroup.children.pop();

    const finish = () => {
      // theme: undoing the winning move brings the game back to
      // "playing" — bring the ambient wind-down back with it, same as
      // a full reset (see handleReset).
      if (windingDownRef.current && target.status === "playing") {
        windingDownRef.current = false;
        // true: unlike a brand-new game, undoing back into active play
        // has no Begin Game button ahead of it to restore volume — see
        // resetWindDown for why this caller needs the opposite default.
        audioRef.current && audioRef.current.resetWindDown(true);
        restartAmbientRef.current.forEach((fn) => fn());
      }
      setPieces(target.pieces);
      setCurrentPlayer(target.currentPlayer);
      setLog(target.log);
      setStatus(target.status);
      setWinner(target.winner);
      setWinReason(target.winReason);
      setShowVictoryPlacard(false);
      setStepsUsed(0);
      setTurnSnapshot(null);
      setPendingNotation([]);
      aiDirsRef.current = null;
      setTurnHistory(stack);
      setBusy(false);
    };

    const processEntry = (idx, workingPieces) => {
      if (idx >= batch.length) {
        finish();
        return;
      }
      const entry = batch[idx];
      const steps = [...entry.dirs].reverse().map((d) => INVERSE_DIR[d]);

      const animateBack = (basePieces) => {
        const moving = basePieces.find((p) => p.id === entry.pieceId);
        if (!moving) {
          processEntry(idx + 1, basePieces);
          return;
        }
        const runStep = (i, state) => {
          if (i >= steps.length) {
            processEntry(idx + 1, basePieces.map((p) => (p.id === state.id ? state : p)));
            return;
          }
          const dir = steps[i];
          animateStep(state, dir, () => {
            const next =
              PIECE_META[state.type].shape === "disc"
                ? { ...state, row: state.row + STEP_DIRS[dir][0], col: state.col + STEP_DIRS[dir][1] }
                : rollBlock(state, dir);
            runStep(i + 1, next);
          });
        };
        runStep(0, moving);
      };

      if (entry.crushedPiece) {
        const withResurrected = [...workingPieces, entry.crushedPiece];
        setPieces(withResurrected);
        setTimeout(() => animateBack(withResurrected), 60);
      } else {
        animateBack(workingPieces);
      }
    };

    processEntry(0, pieces);
  }
  function handleAnomaly() {
    // theme: setup-phase-only random layout generator (see its button,
    // gated on awaitingBegin) — just swaps the piece positions, nothing
    // else about game state, so the player can click it repeatedly
    // ("continue clicking it until they find one they like") and each
    // click is an independent fresh randomization.
    if (!awaitingBegin) return;
    setPieces(generateAnomalySetup());
  }

  function handleReset() {
    // theme: undo a previous win's audio/visual wind-down, if any, so
    // a new game gets the ambient effects back rather than staying
    // permanently silent and static for the rest of the session.
    if (windingDownRef.current) {
      windingDownRef.current = false;
      audioRef.current && audioRef.current.resetWindDown();
      restartAmbientRef.current.forEach((fn) => fn());
    }
    if (anim.current) {
      const t = three.current;
      const carrier = anim.current.pivot || anim.current.carrier;
      if (carrier && t.boardGroup) {
        carrier.children.forEach((c) => {
          c.geometry && c.geometry.dispose();
          c.material && c.material.dispose();
        });
        t.boardGroup.remove(carrier);
      }
      anim.current = null;
    }
    setPieces(createInitialPieces());
    setCurrentPlayer(humanStartSide);
    setSelectedId(null);
    setHoveredId(null);
    setHoverShadow(null);
    setStepsUsed(0);
    setTurnSnapshot(null);
    setPendingNotation([]);
    setTurnHistory([]);
    setLog([]);
    setStatus("playing");
    setWinner(null);
    setWinReason("");
    setShowVictoryPlacard(false);
    setLogCopied(false);
    setLogCopyFailed(false);
    aiDirsRef.current = null;
    aiCabezaStreakRef.current = 0;
    setAiThinking(false);
    setAiPlayer(null);
    setGameArmed(false);
    resetTransitionUntilRef.current = performance.now() + RESET_TRANSITION_MS;
    topDownView(humanStartSide);
  }

  function handleCopyLog() {
    const rows = pairLog(log);
    const lines = rows.map((row) => {
      const dark = row.dark ? `${row.dark.notation}${row.dark.mark ? " " + row.dark.mark : ""}` : "—";
      const light = row.light ? `${row.light.notation}${row.light.mark ? " " + row.light.mark : ""}` : "—";
      return `${row.n}. Dark: ${dark} | Light: ${light}`;
    });
    const summary =
      status === "finished" && winner
        ? `Result: ${winner === "dark" ? "Dark" : "Light"} wins${winReason ? " — " + winReason : ""}`
        : status === "ended"
        ? "Game ended manually, no winner"
        : "";
    const text = [summary, "", ...lines].join("\n");

    function announce(ok) {
      if (ok) {
        setLogCopied(true);
        setTimeout(() => setLogCopied(false), 2000);
      } else {
        setLogCopyFailed(true);
        setTimeout(() => setLogCopyFailed(false), 2500);
      }
    }

    function fallbackCopy() {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        ta.style.top = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      } catch (e) {
        return false;
      }
    }

    try {
      navigator.clipboard.writeText(text).then(
        () => announce(true),
        () => announce(fallbackCopy())
      );
    } catch (e) {
      announce(fallbackCopy());
    }
  }

  function handleEndActiveGame() {
    if (!isPlaying || busy || anim.current) return;
    // theme: manually ending the game winds everything down just like
    // a win does (see the two windingDownRef sites in commitRef.current)
    // — every ambient visual scheduler stops arming new effects, and
    // all sound fades to silence, just over 2s here instead of the
    // win's 3s.
    windingDownRef.current = true;
    // theme: per feedback, END ACTIVE GAME plays the reverse of BEGIN
    // GAME's power-on chime (see playPowerOff) — plays immediately,
    // same as the power-on chime does on the way in, then rides the
    // 2s fade-out below along with everything else.
    audioRef.current && audioRef.current.playPowerOff();
    audioRef.current && audioRef.current.beginFadeOut(2);
    setSelectedId(null);
    setHoveredId(null);
    setHoverShadow(null);
    setStepsUsed(0);
    setTurnSnapshot(null);
    setPendingNotation([]);
    setAiThinking(false);
    aiDirsRef.current = null;
    setStatus("ended");
  }

  const statusText = status === "finished"
    ? `${winner === "dark" ? "Dark" : "Light"} wins · ${winReason}`
    : status === "ended"
    ? "Game ended"
    : aiThinking
    ? `${currentPlayer === "dark" ? "Dark" : "Light"} (AI) thinking…`
    : activePiece && activePiece.owner === currentPlayer
    ? `${PIECE_META[activePiece.type].name} · ${stepsRemaining} ${
        activePiece.type === "cabeza" ? "step" : "roll"
      }${stepsRemaining === 1 ? "" : "s"} left`
    : currentPlayer === "dark"
    ? "Dark to move"
    : "Light to move";

  return (
    <div
      style={{
        height: "100dvh",
        width: "100%",
        display: "flex",
        alignItems: "stretch",
        justifyContent: "center",
        overflowY: "auto",
        padding: "12px 16px",
        /* theme: two faint, wide, low-opacity glows layered under the
           base dark gradient — a hint of distant city light rather than
           any literal skyline. Pure CSS, no new elements. */
        background: `radial-gradient(ellipse at 26% 15%, rgba(77,124,232,0.10), transparent 55%), radial-gradient(ellipse at 82% 88%, rgba(255,120,80,0.05), transparent 50%), linear-gradient(160deg, ${COLORS.pageBg} 0%, ${COLORS.pageBgDeep} 100%)`,
        fontFamily: "'IBM Plex Sans', sans-serif",
        boxSizing: "border-box",
      }}
    >
      <style>{`
        * { box-sizing: border-box; }
        .ec-btn:focus-visible { outline: 2px solid ${COLORS.slate}; outline-offset: 2px; }
        .ec-btn { transition: background-color 0.15s ease, color 0.15s ease; }
        @media (prefers-reduced-motion: reduce) { .ec-btn { transition: none !important; } }
        .ec-btn-invert:hover { background: ${COLORS.charcoal}; color: ${COLORS.cream}; }

        /* theme: rare analog signal-degradation flourish — a brief
           horizontal jitter/tear plus a color-phase wobble on the board
           mount itself (a live DOM element, so this genuinely displaces
           and re-tints the WebGL canvas underneath, not a copy of it),
           paired with a scanline+static overlay flash. See the glitch
           effect for scheduling. */
        @keyframes ec-vhs-glitch {
          0%   { transform: translate(0, 0); filter: none; }
          10%  { transform: translate(-3px, 0); filter: hue-rotate(12deg) saturate(1.5); }
          20%  { transform: translate(3px, 0); filter: hue-rotate(-10deg) saturate(1.4); }
          28%  { transform: translate(-1px, 1px); opacity: 0.82; }
          36%  { transform: translate(0, 0); opacity: 1; filter: none; }
          55%  { transform: translate(2px, 0); filter: hue-rotate(-6deg); }
          64%  { transform: translate(0, 0); filter: none; }
          100% { transform: translate(0, 0); filter: none; }
        }
        .ec-vhs-glitch { animation: ec-vhs-glitch 420ms steps(1, end) 1; }

        /* Profile B: vertical sync roll + line/frame displacement —
           a vertical jump plus a couple of horizontally-offset clipped
           bands, approximating a torn/rolled frame. steps(1,end) makes
           this a sequence of jump-cuts rather than a smooth animation,
           which is also why clip-path polygons/insets with different
           shapes across stops need no matching vertex count. */
        @keyframes ec-vhs-glitch-b {
          0%   { transform: translateY(0); clip-path: none; }
          12%  { transform: translateY(-14px); }
          24%  { transform: translateY(10px); clip-path: inset(0 0 55% 0); }
          30%  { transform: translateY(10px) translateX(4px); clip-path: inset(45% 0 0 0); }
          38%  { transform: translateY(-4px) translateX(-3px); clip-path: none; }
          46%  { transform: translateY(0); }
          100% { transform: translateY(0); clip-path: none; }
        }
        .ec-vhs-glitch-b { animation: ec-vhs-glitch-b 460ms steps(1, end) 1; }

        /* Profile C: signal breakup — brief invert flashes (digital
           corruption/bit errors), a contrast/brightness spike
           (overshoot), and a near-blackout dip (brief signal loss). */
        @keyframes ec-vhs-glitch-c {
          0%   { filter: none; opacity: 1; }
          10%  { filter: invert(1) saturate(2); }
          16%  { filter: none; opacity: 0.15; }
          22%  { filter: contrast(2.2) brightness(1.4); opacity: 1; }
          30%  { filter: none; }
          50%  { filter: invert(1); opacity: 0.3; }
          58%  { filter: none; opacity: 1; }
          100% { filter: none; opacity: 1; }
        }
        .ec-vhs-glitch-c { animation: ec-vhs-glitch-c 500ms steps(1, end) 1; }

        /* Profile D: horizontal sync distortion / tracking distortion —
           the image bends and tears in shifting horizontal bands
           (skewX plus banded clip-path insets), rather than the
           whole-frame roll of profile B or the plain left-right jitter
           of profile A. */
        @keyframes ec-vhs-glitch-d {
          0%   { transform: skewX(0deg) translateX(0); clip-path: none; }
          8%   { transform: skewX(6deg) translateX(-6px); clip-path: inset(10% 0 60% 0); }
          16%  { transform: skewX(-8deg) translateX(8px); clip-path: inset(55% 0 15% 0); }
          24%  { transform: skewX(3deg) translateX(-3px); clip-path: inset(30% 0 40% 0); }
          32%  { transform: skewX(0deg) translateX(0); clip-path: none; }
          50%  { transform: skewX(-4deg) translateX(5px); clip-path: inset(0 0 70% 0); }
          58%  { transform: skewX(0deg) translateX(0); clip-path: none; }
          100% { transform: skewX(0deg) translateX(0); clip-path: none; }
        }
        .ec-vhs-glitch-d { animation: ec-vhs-glitch-d 480ms steps(1, end) 1; }

        /* Profile E: wavy raster distortion / video turbulence / analog
           signal ripple — the two genuine per-pixel warp filters above,
           alternated, plus a gentle skewY/scaleY sweep so the whole
           card reads as organically bending rather than just jittering
           in place. */
        @keyframes ec-vhs-glitch-e {
          0%   { filter: none; transform: skewY(0deg) scaleY(1); }
          14%  { filter: url(#ec-warp-a); transform: skewY(1.2deg) scaleY(1.01); }
          28%  { filter: url(#ec-warp-b); transform: skewY(-1.6deg) scaleY(0.99); }
          42%  { filter: url(#ec-warp-a); transform: skewY(0.8deg) scaleY(1.01); }
          56%  { filter: none; transform: skewY(-0.6deg) scaleY(1); }
          70%  { filter: url(#ec-warp-b); transform: skewY(1deg) scaleY(1); }
          84%  { filter: none; transform: skewY(0deg) scaleY(1); }
          100% { filter: none; transform: skewY(0deg) scaleY(1); }
        }
        .ec-vhs-glitch-e { animation: ec-vhs-glitch-e 560ms steps(1, end) 1; }

        /* Profile F: a full-card wave/warp that blends rapidly through
           several distinct warp shapes in quick succession — the two
           warp filters and alternating skew directions cycle every
           ~35-70ms, so it reads as one shape morphing straight into
           the next rather than a single held distortion. */
        @keyframes ec-vhs-glitch-f {
          0%   { filter: none; transform: skewX(0) skewY(0) scale(1); }
          7%   { filter: url(#ec-warp-a); transform: skewX(4deg) skewY(-2deg) scale(1.008); }
          14%  { filter: url(#ec-warp-b); transform: skewX(-5deg) skewY(2deg) scale(0.992); }
          21%  { filter: url(#ec-warp-a) hue-rotate(8deg); transform: skewX(3deg) skewY(-3deg) scale(1.01); }
          28%  { filter: url(#ec-warp-b); transform: skewX(-6deg) skewY(1deg) scale(0.99); }
          35%  { filter: url(#ec-warp-a); transform: skewX(2deg) skewY(2deg) scale(1.006); }
          42%  { filter: none; transform: skewX(-3deg) skewY(-1deg) scale(0.996); }
          49%  { filter: url(#ec-warp-b) saturate(1.4); transform: skewX(4deg) skewY(3deg) scale(1.01); }
          56%  { filter: url(#ec-warp-a); transform: skewX(-2deg) skewY(-2deg) scale(0.995); }
          63%  { filter: none; transform: skewX(1deg) skewY(1deg) scale(1); }
          100% { filter: none; transform: skewX(0) skewY(0) scale(1); }
        }
        .ec-vhs-glitch-f { animation: ec-vhs-glitch-f 520ms steps(1, end) 1; }

        /* theme: two new, much-rarer full-card flourishes (see the
           dedicated scheduler below — separate from and far less
           frequent than the regular VHS glitch rotation above).

           ec-scanimate: a Scanimate-style analog video synthesizer
           pass — the 1970s analog computer systems (Scanimate, the
           Rutt-Etra, Paik-Abe) that generated broadcast graphics by
           warping and color-cycling a live video signal. Reuses the
           existing #ec-warp-a/#ec-warp-b turbulence displacement
           filters (liquid, not glitchy, distortion) combined with a
           full hue-rotate sweep and a slow vertical roll/stretch. Uses
           smooth ease timing rather than the other profiles' hard
           steps(1,end) cuts — this is meant to read as a flowing,
           synthesized image, not a broken one. */
        @keyframes ec-scanimate {
          0%   { filter: hue-rotate(0deg) saturate(1); transform: translateY(0) scaleY(1); }
          20%  { filter: hue-rotate(60deg) url(#ec-warp-b) saturate(1.5); transform: translateY(-3px) scaleY(1.008); }
          40%  { filter: hue-rotate(140deg) url(#ec-warp-a) saturate(1.8); transform: translateY(2px) scaleY(0.994); }
          60%  { filter: hue-rotate(220deg) url(#ec-warp-b) saturate(1.6); transform: translateY(-2px) scaleY(1.006); }
          80%  { filter: hue-rotate(300deg) url(#ec-warp-a) saturate(1.3); transform: translateY(1px) scaleY(0.998); }
          100% { filter: hue-rotate(360deg) saturate(1); transform: translateY(0) scaleY(1); }
        }
        .ec-scanimate { animation: ec-scanimate 900ms ease-in-out 1; }

        /* ec-vidicon-burn: an old analog camera Vidicon tube's own two
           signature faults, combined — "burn" (a bright image scorches
           a temporary ghost/negative afterimage into the tube's
           photoconductive surface, read here as a brief partial
           invert()) and "deflection overload" (the beam-steering
           circuit overdriven, read as a horizontal stretch spike plus
           a bloom of brightness/contrast and a comet-tail streak via
           an offset drop-shadow trailing the over-bright image).
           steps(1,end), unlike Scanimate above — this is a sudden
           electrical fault, not a flowing image. */
        @keyframes ec-vidicon-burn {
          0%   { filter: brightness(1) contrast(1) invert(0); transform: scaleX(1); }
          8%   { filter: brightness(2.2) contrast(1.6) invert(0.15) drop-shadow(14px 0 rgba(77,232,255,0.5)); transform: scaleX(1.05); }
          16%  { filter: brightness(2.6) contrast(1.8) invert(0.25) drop-shadow(22px 0 rgba(77,232,255,0.4)); transform: scaleX(1.09); }
          28%  { filter: brightness(1.4) contrast(1.2) invert(0.1) drop-shadow(10px 0 rgba(77,232,255,0.25)); transform: scaleX(1.02); }
          45%  { filter: brightness(1.1) contrast(1.05) invert(0.04); transform: scaleX(0.995); }
          70%  { filter: brightness(1) contrast(1) invert(0); transform: scaleX(1); }
          100% { filter: brightness(1) contrast(1) invert(0); transform: scaleX(1); }
        }
        .ec-vidicon-burn { animation: ec-vidicon-burn 650ms steps(1, end) 1; }

        @keyframes ec-vhs-overlay {
          0%   { opacity: 0; }
          10%  { opacity: 0.55; }
          22%  { opacity: 0.1; }
          30%  { opacity: 0.4; }
          46%  { opacity: 0.05; }
          60%  { opacity: 0.3; }
          100% { opacity: 0; }
        }
        .ec-vhs-overlay-active { animation: ec-vhs-overlay 420ms steps(1, end) 1; }

        /* theme: localized text/button jitter-tear — see the scheduler
           effect above. clip-path insets slice the element horizontally
           at a shifting offset each step, combined with a small
           translate, for a quick "tearing" read rather than a smooth
           wobble; steps(1, end) keeps every step a hard cut, matching
           the VHS glitch profiles' snappiness instead of easing between
           positions. */
        @keyframes ec-jitter-tear {
          0%   { transform: translate(0, 0); clip-path: inset(0 0 0 0); }
          15%  { transform: translate(-3px, 1px); clip-path: inset(10% 0 60% 0); }
          30%  { transform: translate(2px, -1px); clip-path: inset(55% 0 15% 0); }
          45%  { transform: translate(-2px, 0); clip-path: inset(0 0 0 0); }
          60%  { transform: translate(3px, 1px); clip-path: inset(30% 0 40% 0); }
          75%  { transform: translate(-1px, -1px); clip-path: inset(0 0 0 0); }
          100% { transform: translate(0, 0); clip-path: inset(0 0 0 0); }
        }
        .ec-jitter-tear { animation: ec-jitter-tear 160ms steps(1, end) 1; }
        @keyframes ec-jitter-tear-b {
          0%   { transform: translate(0, 0) skewX(0deg); clip-path: inset(0 0 0 0); }
          20%  { transform: translate(4px, -1px) skewX(2deg); clip-path: inset(40% 0 20% 0); }
          40%  { transform: translate(-3px, 1px) skewX(-1deg); clip-path: inset(5% 0 70% 0); }
          60%  { transform: translate(2px, 0) skewX(1deg); clip-path: inset(0 0 0 0); }
          80%  { transform: translate(-2px, -1px) skewX(0deg); clip-path: inset(60% 0 5% 0); }
          100% { transform: translate(0, 0) skewX(0deg); clip-path: inset(0 0 0 0); }
        }
        .ec-jitter-tear-b { animation: ec-jitter-tear-b 190ms steps(1, end) 1; }

        @media (prefers-reduced-motion: reduce) {
          .ec-vhs-glitch, .ec-vhs-glitch-b, .ec-vhs-glitch-c, .ec-vhs-glitch-d, .ec-vhs-glitch-e, .ec-vhs-glitch-f, .ec-vhs-overlay-active, .ec-jitter-tear, .ec-jitter-tear-b, .ec-scanimate, .ec-vidicon-burn { animation: none !important; }
        }
      `}</style>

      <svg width="0" height="0" style={{ position: "absolute" }} aria-hidden="true">
        <defs>
          <filter id="ec-static">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise" />
            <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.7  0 0 0 0 0.92  0 0 0 0 1  0 0 0 0.9 0" />
          </filter>
          {/* theme: two genuine per-pixel warp filters — coarse, low-
             frequency turbulence displacing the actual rendered card
             content — for "video turbulence / wavy raster / analog
             signal ripple," rather than the uniform skew/translate the
             other glitch profiles use. baseFrequency is given as an
             "x y" pair so horizontal and vertical wave scale differ,
             which is what makes it read as bending/rippling rather
             than jittering. The expanded x/y/width/height keeps
             displaced pixels from clipping hard at the element edge. */}
          <filter id="ec-warp-a" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="turbulence" baseFrequency="0.008 0.05" numOctaves="2" seed="3" result="ec-warp-a-noise" />
            <feDisplacementMap in="SourceGraphic" in2="ec-warp-a-noise" scale="26" xChannelSelector="R" yChannelSelector="G" />
          </filter>
          <filter id="ec-warp-b" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="turbulence" baseFrequency="0.015 0.02" numOctaves="1" seed="9" result="ec-warp-b-noise" />
            <feDisplacementMap in="SourceGraphic" in2="ec-warp-b-noise" scale="34" xChannelSelector="R" yChannelSelector="B" />
          </filter>
        </defs>
      </svg>

      <div
        ref={cardRef}
        style={{
          width: "100%",
          maxWidth: 780,
          background: COLORS.cream,
          border: `1px solid ${COLORS.slateSoft}`,
          boxShadow: "0 0 1px rgba(77,232,255,0.25), 0 24px 60px rgba(0,0,0,0.6)",
          padding: "18px 24px 16px",
          position: "relative",
          display: "flex",
          flexDirection: "column",

             page behind it. */
          overflow: "hidden",

            style={{
              margin: 0,
              fontFamily: "'Chakra Petch', sans-serif",

              fontSize: "clamp(22px, 7vw, 31px)",

          >
            {/* Each letter its own span so the burnout effect can dim

            <span ref={titleRef} onClick={handleTitleClick} style={{ display: "inline-block" }}>
              {"EL CABEZA".split("").map((ch, i) => (

          className="ec-btn"

            pointerEvents: infoBtnVisible ? "auto" : "none",
            transition: "opacity 0.3s ease, background-color 0.15s ease, color 0.15s ease",
          }}
        >
          Info
        </button>

        <div
          style={{
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            gap: 12,

            padding: "0 14px",

                   legend dots) now follows too.

                   (1 = this resting size) rather than fixed px, so the

                background: currentPlayer === "dark" ? COLORS.bodyDark : COLORS.bodyLight,

const MINI_BUTTON_BASE = {
  fontFamily: "'IBM Plex Mono', monospace",
  fontSize: 10,
  letterSpacing: "0.1em",
  textTransform: "uppercase",
  padding: "6px 10px",
  cursor: "pointer",
  border: `1.5px solid ${COLORS.charcoal}`,
};

function playerButtonStyle(player) {
  const isDark = player === "dark";
  /* theme: fill matches the actual piece body color for this side
     (near-black for Dark, white for Light) — the same rule the status
     dot, victory dot, and log legend dots all follow — with the
     player's accent hue living only in the border and glow, never the
     fill itself. */
  return {
    ...MINI_BUTTON_BASE,
    background: isDark ? COLORS.bodyDark : COLORS.bodyLight,
    color: isDark ? COLORS.charcoal : COLORS.inkOnAccent,
    borderColor: isDark ? COLORS.accentDark : COLORS.accentLight,
    boxShadow: `0 0 10px ${isDark ? COLORS.accentDark : COLORS.accentLight}`,
  };
}

function ghostButtonStyle() {
  return {
    ...MINI_BUTTON_BASE,
    background: "transparent",
    color: COLORS.slate,
    borderColor: COLORS.slateSoft,
  };
}

function toggleButtonStyle(active) {
  return active
    ? { ...MINI_BUTTON_BASE, background: COLORS.charcoal, color: COLORS.cream }
    : ghostButtonStyle();
}

function aiSideButtonStyle(side) {
  const isDark = side === "dark";
  return {
    fontFamily: "'IBM Plex Mono', monospace",
    fontSize: 10,
    letterSpacing: "0.1em",
    textTransform: "uppercase",
    padding: "6px 14px",
    cursor: "pointer",
    borderRadius: 999,
    /* theme: same body-fill/accent-halo pairing as playerButtonStyle,
       so the AI-Dark/AI-Light pills read as the same chip language. */
    border: `1.5px solid ${isDark ? COLORS.accentDark : COLORS.accentLight}`,
    background: isDark ? COLORS.bodyDark : COLORS.bodyLight,
    color: isDark ? COLORS.charcoal : COLORS.inkOnAccent,
    boxShadow: `0 0 10px ${isDark ? COLORS.accentDark : COLORS.accentLight}`,
  };
}
