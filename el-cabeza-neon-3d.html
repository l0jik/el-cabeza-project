<title>Neon Cabeza</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { --ec-page-bg: #05070c; }
  html, body { margin: 0; background: var(--ec-page-bg); }
  #root { min-height: 100dvh; }
  /* Restrained hover glow — the one new interaction cue this theme adds.
     Purely cosmetic (box-shadow only); no layout, timing, or hit-testing
     is touched, so it cannot affect what a click actually does. */
  .ec-btn:hover:not(:disabled) {
    box-shadow: 0 0 0 1px rgba(77, 232, 255, 0.35), 0 0 14px rgba(77, 232, 255, 0.16);
  }
  @media (prefers-reduced-motion: reduce) {
    .ec-btn:hover:not(:disabled) { box-shadow: none; }
  }
  /* Irregular power-grid flicker on the title. Restarted imperatively
     (class removed, reflowed, re-added) at randomized intervals rather
     than looped in CSS, so the flicker itself never falls into a
     detectable rhythm — see the title-flicker effect in the component. */
  @keyframes ec-title-flicker {
    0%   { opacity: 1; }
    4%   { opacity: 0.32; }
    7%   { opacity: 1; }
    11%  { opacity: 0.55; }
    12%  { opacity: 1; }
    38%  { opacity: 1; }
    41%  { opacity: 0.4; }
    44%  { opacity: 0.9; }
    46%  { opacity: 1; }
    100% { opacity: 1; }
  }
  .ec-title-flicker { animation: ec-title-flicker 1.1s linear 1; }
  /* Two further variants with different dip counts/timing — the
     scheduler picks one of the three at random each time (see the
     title effect), so "the flicker" is never quite the same shape
     twice in a row, on top of its already-randomized interval. */
  @keyframes ec-title-flicker-b {
    0%   { opacity: 1; }
    5%   { opacity: 0.15; }
    8%   { opacity: 1; }
    9%   { opacity: 0.5; }
    13%  { opacity: 1; }
    60%  { opacity: 1; }
    63%  { opacity: 0.25; }
    66%  { opacity: 1; }
    100% { opacity: 1; }
  }
  @keyframes ec-title-flicker-c {
    0%   { opacity: 1; }
    3%   { opacity: 0.6; }
    6%   { opacity: 1; }
    22%  { opacity: 1; }
    25%  { opacity: 0.1; }
    27%  { opacity: 0.7; }
    29%  { opacity: 0.2; }
    32%  { opacity: 1; }
    100% { opacity: 1; }
  }
  .ec-title-flicker-b { animation-name: ec-title-flicker-b; animation-timing-function: linear; animation-iteration-count: 1; }
  .ec-title-flicker-c { animation-name: ec-title-flicker-c; animation-timing-function: linear; animation-iteration-count: 1; }
  @media (prefers-reduced-motion: reduce) {
    .ec-title-flicker, .ec-title-flicker-b, .ec-title-flicker-c { animation: none; }
  }
  /* A single spark: a tiny bright point that flashes and drifts off
     before fading, spawned near the title at rare, irregular
     intervals — see spawnSpark in the title effect. */
  @keyframes ec-spark {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.5); }
    18%  { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--ec-spark-dx, 6px), var(--ec-spark-dy, -10px)) scale(0.7); }
  }
  .ec-spark {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #f2fdff;
    box-shadow: 0 0 5px 1px rgba(150, 235, 255, 0.95), 0 0 12px 3px rgba(77, 232, 255, 0.5);
    pointer-events: none;
    animation: ec-spark 600ms ease-out forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .ec-spark { display: none; }
  }

  /* SINGULARITY: a "Phantom Reveal" button -- black-on-black and
     heavily blurred at rest, so it reads as an absence rather than a
     dim control, until hovered. Sized entirely from its flex-column
     parent (see the awaitingBegin block) rather than any fixed pixel
     target, so it always spans exactly the Anomaly/Begin Game row's
     own width above it. */
  .ec-singularity-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    aspect-ratio: 5.5 / 1;
    min-height: 42px;
    background: #000000;
    border: 1.5px solid rgba(77, 232, 255, 0.18);
    box-sizing: border-box;
    padding: 8px 16px;
    overflow: hidden;
    cursor: pointer;
  }
  .ec-singularity-text {
    font-family: 'Chakra Petch', sans-serif;
    font-size: clamp(13px, 3.2vw, 24px);
    letter-spacing: 0.16em;
    line-height: 1;
    white-space: nowrap;
    color: #000000;
    font-weight: 100;
    filter: blur(10px);
    text-shadow: none;
    pointer-events: none;
    transition: color 2s ease-in-out, filter 2s ease-in-out, font-weight 2s ease-in-out, text-shadow 2s ease-in-out;
  }
  .ec-singularity-btn:hover .ec-singularity-text,
  .ec-singularity-btn:focus-visible .ec-singularity-text {
    color: #00ffff;
    font-weight: 900;
    filter: blur(0);
    text-shadow:
      0 0 0.05em #00ffff,
      0 0 0.16em #00ffff,
      0 0 0.4em rgba(0, 255, 255, 0.85),
      0 0 0.85em rgba(0, 255, 255, 0.65),
      0 0 1.6em rgba(0, 255, 255, 0.45),
      0 0 2.6em rgba(0, 255, 255, 0.3);
    animation: ec-singularity-pulse 1.7s ease-in-out 2s infinite alternate;
  }
  @keyframes ec-singularity-pulse {
    0% {
      color: #00ffff;
      text-shadow:
        0 0 0.05em #00ffff,
        0 0 0.16em #00ffff,
        0 0 0.4em rgba(0, 255, 255, 0.85),
        0 0 0.85em rgba(0, 255, 255, 0.65),
        0 0 1.6em rgba(0, 255, 255, 0.45),
        0 0 2.6em rgba(0, 255, 255, 0.3);
    }
    100% {
      color: #c9a0ff;
      text-shadow:
        0 0 0.07em #c9a0ff,
        0 0 0.22em #8a2be2,
        0 0 0.55em rgba(138, 43, 226, 0.85),
        0 0 1.1em rgba(138, 43, 226, 0.6),
        0 0 2.1em rgba(77, 232, 255, 0.5),
        0 0 3.2em rgba(77, 232, 255, 0.28);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .ec-singularity-text { transition-duration: 0.3s; }
    .ec-singularity-btn:hover .ec-singularity-text,
    .ec-singularity-btn:focus-visible .ec-singularity-text {
      animation: none;
    }
  }
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useRef, useEffect, useState, useCallback } = React;
const THREE = window.THREE;

/* ------------------------------------------------------------------ */
/*  El Cabeza — 3D                                                     */
/*                                                                     */
/*  Rules layer is unchanged from the 2D build: every block is a box    */
/*  w x h x z, and pivoting over an edge swaps z with the axis being    */
/*  rolled over. In 3D that pivot is animated literally — the piece     */
/*  tips over its contact edge, so the change in height and footprint   */
/*  is something you watch rather than infer.                           */
/*                                                                     */
/*  World axes: +x = columns, +z = rows (south), +y = up.               */
/* ------------------------------------------------------------------ */

/* App version — Semantic Versioning (MAJOR.MINOR.PATCH). MAJOR is
   reserved for a genuinely fundamental rework (data model, rendering
   architecture, that scale of change) rather than "a lot happened";
   MINOR for new capability that doesn't break anything existing;
   PATCH for fixes and small tweaks. Per standing instruction, this is
   now bumped automatically whenever a change to this file warrants
   it — no need to ask each time — with the INFO overlay's footer (see
   showInfoOverlay further down) updated to match in the same edit, so
   the two can never quietly drift apart. v1.0.0 marks this becoming a
   fully playable game — 3D board, full rules engine, working minimax
   AI — earlier in this project's history, before v1.7.0's responsive
   flex-fill layout (this file's version at the time this scheme was
   introduced). */
const APP_VERSION = "1.39.0";

const BOARD_SIZE = 10;
/* Border reduced from the historical MARGIN_OLD baseline in two rounds
   now: 20% first, then a further reduction to a cumulative 40% off
   that same baseline. The overall board footprint (SLAB) is held fixed
   at its old value both times, so the space the border gives up is
   exactly the space the grid gains — this isn't a free size increase,
   it's a reallocation, and it composes the same way a second time as
   it did the first. Squares grow to 1.056 world units each as a
   result; see SQUARE_SIZE below. Piece geometry is NOT built from
   SQUARE_SIZE (see PIECE_SCALE) so pieces stay their old absolute size
   and simply sit with more visible margin inside their now-larger
   squares. */
const MARGIN_OLD = 0.7;
const SLAB = BOARD_SIZE + MARGIN_OLD * 2; // 11.4, fixed regardless of the split below
const MARGIN = MARGIN_OLD * 0.6; // 0.42 — the 40% cumulative decrease
const SQUARE_SIZE = (SLAB - MARGIN * 2) / BOARD_SIZE; // 1.056 world units/square
/* The crawling voxel mass (see spawnCrawlWave) is built on a finer
   sub-grid than the board's own squares — per feedback ("each grid box
   on the game board could fit 9 smaller blocks within it"), each voxel
   is sized so exactly CRAWL_SUB x CRAWL_SUB of them tile one board
   square, reading as a distinctly different, finer-grained texture
   layered under the board rather than blending into the board's own
   grid at the same scale. */
const CRAWL_SUB = 3;
const CRAWL_VOXEL = SQUARE_SIZE / CRAWL_SUB;
/* The slab's vertical thickness (its Y dimension — SLAB above is its
   footprint, X/Z). Reduced 25% from its original 0.5. slab.position.y
   in the scene-setup effect is derived from this (-SLAB_THICKNESS / 2)
   rather than a second hardcoded number, so the two can't drift out of
   sync — that position keeps the slab's TOP surface sitting at
   y = 0 regardless of thickness, since every piece and the grid itself
   are positioned relative to that surface, not the slab's center. */
const SLAB_THICKNESS = 0.375;
const GRID_EXTENT = BOARD_SIZE * SQUARE_SIZE;
const OFF = GRID_EXTENT / 2;
/* Every piece is scaled by the same factor, so true proportions are kept
   (a Turrito stays a cube, a Flaco stays 1:1:2) while a gap opens up
   between each piece and the square it occupies. */
const PIECE_SCALE = 0.8;
const DISC_DIAM = 1.0304; // 0.896 x 1.15 — diameter only, height unchanged below
const DISC_H = 0.246;
/* Move outlines sit wider than the piece that would land there, so the
   dashed rule reads as a target square rather than as the piece's own
   edge. */
const GHOST_SCALE = 0.94;
/* Duration of a move-indicator's opacity transition, in ms — both
   directions (appearing and disappearing). "Quick" per an explicit
   request: fast enough to read as responsive rather than as a
   deliberate animation in its own right. */
const GHOST_FADE_MS = 130;
/* Retargets a ghostLine's opacity fade without resetting the mesh
   itself — always starts from whatever the mesh is CURRENTLY rendering
   (not from its old target), so re-targeting mid-fade (e.g. a
   fade-in interrupted by the set becoming stale before it finishes)
   continues smoothly from the visible value rather than jumping. */
function setGhostLineTarget(mesh, target, fadingOut) {
  mesh.userData.opacityFrom = mesh.material.opacity;
  mesh.userData.opacityTo = target;
  mesh.userData.opacityStart = performance.now();
  if (fadingOut) mesh.userData.fadingOut = true;
}
/* Edge rounding, in board units where one square = 1 inch. 0.125 = a
   1/8" roundover. This is the single number to tune. */
const EDGE_RADIUS = 0.03;
/* 500, raised from 300 as a deliberate test of the warping perception.
   A simulation of the projected silhouette showed the shape change is
   pure rigid rotation (unavoidable and geometrically correct), but at
   300ms it peaks at ~4.1% of the piece's size PER FRAME — fast enough
   that the eye can read it as deformation rather than rotation. The
   same motion over 500ms is ~30 frames instead of ~18, dropping the
   peak to ~2.5%/frame without altering the geometry at all. The same
   simulation ruled out the other suspects: FOV has literally zero
   effect on the silhouette's aspect ratio (focal length scales screen
   width and height equally), camera distance is near-irrelevant
   (14.1% vs 14.6% swing across the whole zoom range), and the
   residual translation contributes ~0.25 points. Camera pitch is the
   only stronger lever (31.7% swing near top-down vs 2.9% from a low
   angle), but that changes how the whole game reads, not just rolls. */
const ROLL_MS = 500;
/* Matches ROLL_MS rather than its own number — a flat glide at a
   different pace than the rolls would still read as inconsistent even
   without the vertical arc that used to make it look like a hop. */
const SLIDE_MS = ROLL_MS;
/* How fast the rendered camera catches up to where input wants it.
   Higher = snappier/less lag, lower = smoother/more float. */
const CAMERA_DAMPING = 9;
/* A New Game / End Active Game reset can swing the board up to 180°
   in one motion (whichever side the fresh game needs facing down),
   not the small nudge CAMERA_DAMPING is tuned for — at 9, even that
   full swing is ~95% settled within a third of a second, which reads
   as a snap for a rotation that size, especially landing at the exact
   moment the pieces themselves repopulate instantly. RESET_CAMERA_DAMPING
   is a separate, slower rate used only for the brief window right after
   a reset (see resetTransitionUntilRef / tick()) — everything else
   about the easing math is identical, just unhurried for this one
   specific, deliberately "settling" moment. First tried at 4 (~1.15s to
   99%), which read as sluggish rather than just softened; 6 (~0.77s to
   99%) is the adjustment — still clearly slower than the interactive
   rate, just not dragging on. RESET_TRANSITION_MS is that window's
   length, set comfortably longer than this rate's own ~99%-converged
   time so the switch back to the fast rate at the end is never itself
   visible as a speed change. */
const RESET_CAMERA_DAMPING = 6;
const RESET_TRANSITION_MS = 1000;
/* Raw drag-to-radians sensitivity, lowered from the original 0.006/0.005
   — combined with CAMERA_DAMPING above, this is the "decreased touch
   sensitivity plus acceleration" fix together. */
const ORBIT_SENS_THETA = 0.0046;
const ORBIT_SENS_PHI = 0.0038;
/* Cumulative pointer travel (px) required before a single-pointer touch
   is treated as an actual drag — both for starting to rotate the board
   (onMove) and for telling a drag apart from a tap on release (wasDrag).
   One shared threshold for both so they can't disagree with each other. */
const DRAG_DEAD_ZONE_PX = 10;
/* Camera distance bounds — every zoom clamp (wheel, pinch, and the
   Top-Down View button's "50%") reads from these two, so they can't
   drift out of sync with each other. */
const ZOOM_MIN = 9;
const ZOOM_MAX = 34;

/* -------------------------- TRON/NOIR THEME ------------------------ */
/* Everything visual in this experimental skin lives in these two
   objects (COLORS for the DOM/CSS layer, HEX for the Three.js scene
   just below) plus a handful of Three.js material constants marked
   "theme:" in comments near their use. Nothing outside these islands
   was touched — every rule, AI weight, camera constant, and state
   handler is byte-for-byte the same as the original light build. To
   restore the original look, swap these two objects (and the marked
   material lines) back; nothing else needs to change.

   The four neutral roles (surface/surfaceAlt/ink/inkMuted) keep their
   ORIGINAL names (cream/creamAlt/charcoal/slate) so every existing
   style rule that already reads COLORS.cream or COLORS.charcoal just
   inherits the new dark values automatically — only the handful of
   spots that used charcoal/cream to mean "Dark player" / "Light
   player" specifically (see accentDark/accentLight below) were
   re-pointed at the new dedicated player-accent tokens, since blindly
   inverting lightness on a shared token would have made both players'
   chips read as "ink vs. surface" instead of two distinct hues. */
const COLORS = {
  /* Card / panel surface — was near-white, now the near-black glass
     the whole UI sits on. */
  cream: "#0B0F14",
  creamAlt: "#10151C",
  /* Primary ink — was near-black text on a light card, now a cool
     ice-white for text/borders on the new dark surfaces. */
  charcoal: "#D9E7EC",
  /* Secondary/muted ink — kept the same relative role, shifted cool. */
  slate: "#5C7A88",
  slateSoft: "rgba(93, 197, 227, 0.22)",
  slateFaint: "rgba(93, 197, 227, 0.10)",
  /* Outer page background, behind the app card. */
  pageBg: "#080B12",
  pageBgDeep: "#020305",
  /* New: dedicated player-identity accents. Player chips, the current-
     player dot, and the win placard read these directly instead of
     the ink/surface pair above, so "whose piece is this" stays a
     single, consistent hue per side rather than a light/dark
     inversion that a dark theme would otherwise muddy. */
  accentDark: "#4DE8FF", // Dark player's glow/halo — electric cyan
  accentLight: "#FFB454", // Light player's glow/halo — warm amber
  accentDanger: "#FF3D7A", // capture/crush warning, distinct from both players
  /* Player chip FILL colors — matched to the actual rendered piece
     materials (see HEX.charcoal/HEX.pieceLight in the 3D scene) rather
     than the saturated accent hues above. Every player-colored circle
     or button uses one of these for its fill and the matching accent
     above only as a border/box-shadow halo, so a UI chip reads as "the
     piece, glowing" instead of "a solid accent-colored swatch." */
  bodyDark: "#0D1116",
  bodyLight: "#FFFFFF",
  /* Near-black text placed ON TOP of a bright/pale fill (player chips)
     for guaranteed contrast. */
  inkOnAccent: "#06090D",
};

const HEX = {
  /* Kept in sync with COLORS.cream, same reasoning as before. */
  cream: 0x0b0f14,
  /* Light piece body — cool pale steel instead of warm tan, so its
     amber emissive edge (see the piece-material build effect) reads
     as a deliberate accent rather than fighting the base color. */
  pieceLight: 0xb9c4ce,
  /* Dark piece body. Also still used for the grid's outer border line
     — see makeGrid, unchanged call site, new value. */
  charcoal: 0x0d1116,
  /* Grid line color — dim, desaturated steel-blue; opacity is turned
     down at the call site too, since a tinted line reads busier than
     a neutral gray one at the same alpha. */
  slate: 0x24414c,
  /* Slab side material — was light wood, now a near-black voxel body;
     roughness/metalness are adjusted at the call site for a faint
     brushed-metal sheen. */
  wood: 0x11151c,
  /* New: the two per-player neon rim colors, used on the piece outline
     shell (the existing silhouette trick — see build-pieces) and on
     the move/ghost indicator lines, so a piece's glow and the move
     options it's showing share one hue per side. */
  glowCyan: 0x4de8ff,
  glowAmber: 0xffb454,
  /* Per feedback, the Light piece OUTLINE specifically uses a darker,
     more saturated orange than the body's own pale amber accent above
     — distinct color, not just a dimmed version of glowAmber. */
  glowAmberOutline: 0xcc5c0e,
  /* New: capture-move indicator color — distinct from both player
     accents so "this move captures" reads as its own signal. */
  glowMagenta: 0xff3d7a,
  /* New: neutral structural edge color for the board's own border —
     deliberately dimmer/cooler than either player accent, so the
     board itself still reads as neutral architecture, not as
     belonging to one side. */
  structureEdge: 0x3f6472,
};

const PIECE_META = {
  cabeza: { label: "C", name: "Cabeza", shape: "disc", maxSteps: 2 },
  turrito: { label: "T", name: "Turrito", shape: "block", maxSteps: 2 },
  opa: { label: "O", name: "Opa", shape: "block", maxSteps: 1 },
  flaco: { label: "F", name: "Flaco", shape: "block", maxSteps: 2 },
  chato: { label: "Ch", name: "Chato", shape: "block", maxSteps: 2 },
};

const GOAL_ROW = { dark: BOARD_SIZE - 1, light: 0 };

const ROLL_DIRS = ["N", "E", "S", "W"];
const STEP_DIRS = {
  N: [-1, 0],
  NE: [-1, 1],
  E: [0, 1],
  SE: [1, 1],
  S: [1, 0],
  SW: [1, -1],
  W: [0, -1],
  NW: [-1, -1],
};

/* ---------------------------- rules ------------------------------- */

/* Rolling W exactly inverts rolling E (and N/S likewise): from the
   rolled state, col+w−z returns the original col and the dimension swap
   reverses. So an undo is the recorded directions, inverted, played
   backwards — no separate reverse transform is needed. */
const INVERSE_DIR = {
  N: "S",
  S: "N",
  E: "W",
  W: "E",
  NE: "SW",
  SW: "NE",
  NW: "SE",
  SE: "NW",
};

function createInitialPieces() {
  return [
    { id: "dark-flaco", type: "flaco", owner: "dark", row: 0, col: 3, w: 1, h: 2, z: 1 },
    { id: "dark-turrito", type: "turrito", owner: "dark", row: 0, col: 4, w: 1, h: 1, z: 1 },
    { id: "dark-cabeza", type: "cabeza", owner: "dark", row: 0, col: 5, w: 1, h: 1, z: 1 },
    { id: "dark-chato", type: "chato", owner: "dark", row: 0, col: 6, w: 1, h: 2, z: 2 },
    { id: "dark-opa", type: "opa", owner: "dark", row: 1, col: 4, w: 2, h: 2, z: 2 },
    { id: "light-chato", type: "chato", owner: "light", row: 8, col: 3, w: 1, h: 2, z: 2 },
    { id: "light-opa", type: "opa", owner: "light", row: 7, col: 4, w: 2, h: 2, z: 2 },
    { id: "light-cabeza", type: "cabeza", owner: "light", row: 9, col: 4, w: 1, h: 1, z: 1 },
    { id: "light-turrito", type: "turrito", owner: "light", row: 9, col: 5, w: 1, h: 1, z: 1 },
    { id: "light-flaco", type: "flaco", owner: "light", row: 8, col: 6, w: 1, h: 2, z: 1 },
  ];
}

/* Each type's possible footprints — every way its physical block can
   be stood on the board. Turrito and Opa are true cubes (1x1x1 and
   2x2x2) and Cabeza is a disc, so each has exactly one orientation;
   Flaco (a 1x1x2 block) and Chato (a 1x2x2 block) each have a repeated
   pair of dimensions plus one different one, so each has exactly 3
   distinct standing orientations — which axis (w, h, or z) gets the
   odd-one-out size. Per feedback, the ANOMALY generator below picks
   one of these per piece too, not just a position — e.g. Flaco
   "standing upright" is its {w:1,h:1,z:2} orientation, Chato "laying
   down" is its {w:2,h:2,z:1} one. Movement itself needs no changes for
   this: rolling is already fully generic over whatever w/h/z a piece
   currently has (that's how Opa's 2x2 and Turrito's 1x1 already
   coexist under the same rules), so a reoriented Flaco just moves
   exactly like any other piece with a 1x1 footprint and z:2 height
   already would. */
const PIECE_ORIENTATIONS = {
  flaco: [
    { w: 1, h: 2, z: 1 },
    { w: 2, h: 1, z: 1 },
    { w: 1, h: 1, z: 2 },
  ],
  turrito: [{ w: 1, h: 1, z: 1 }],
  cabeza: [{ w: 1, h: 1, z: 1 }],
  chato: [
    { w: 1, h: 2, z: 2 },
    { w: 2, h: 1, z: 2 },
    { w: 2, h: 2, z: 1 },
  ],
  opa: [{ w: 2, h: 2, z: 2 }],
};

function shuffledIndices(n) {
  const arr = Array.from({ length: n }, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* theme: the ANOMALY button (setup-phase only, see its JSX) generates a
   fresh random opening layout that's rotationally symmetrical — each
   side's own five pieces confined entirely to its own back two rows,
   and Light's arrangement is always the exact 180-degree rotation of
   Dark's (the same piece type sitting at the point-reflected cell).
   Only Dark's five pieces are ever actually placed/randomized; Light's
   are derived by reflecting each one through the board's center
   (row -> BOARD_SIZE - row - h, col -> BOARD_SIZE - col - w). That's
   what GUARANTEES the symmetry and both sides' row confinement at
   once, rather than generating and separately validating two halves —
   reflecting a cell that's within Dark's rows {0,1} always lands
   within Light's rows {BOARD_SIZE-2, BOARD_SIZE-1}, automatically.
   Bigger pieces are placed first (greedy) since they're the most
   constrained; only 10 of the 20 cells in the 2-row band ever need to
   be filled, so a handful of shuffled retries is enough to succeed
   essentially every time. */
function generateAnomalySetup() {
  const types = ["opa", "chato", "flaco", "turrito", "cabeza"];
  for (let attempt = 0; attempt < 300; attempt++) {
    const occupied = new Set();
    const placed = [];
    let ok = true;
    for (const type of types) {
      const orientations = PIECE_ORIENTATIONS[type];
      const { w, h, z } = orientations[Math.floor(Math.random() * orientations.length)];
      const rowOptions = [];
      for (let row = 0; row <= 2 - h; row++) rowOptions.push(row);
      const colOptions = [];
      for (let col = 0; col <= BOARD_SIZE - w; col++) colOptions.push(col);
      const rowOrder = shuffledIndices(rowOptions.length).map((i) => rowOptions[i]);
      const colOrder = shuffledIndices(colOptions.length).map((i) => colOptions[i]);
      let placedThis = false;
      for (const row of rowOrder) {
        for (const col of colOrder) {
          let free = true;
          for (let r = row; r < row + h && free; r++) {
            for (let c = col; c < col + w; c++) {
              if (occupied.has(r * BOARD_SIZE + c)) { free = false; break; }
            }
          }
          if (free) {
            for (let r = row; r < row + h; r++) for (let c = col; c < col + w; c++) occupied.add(r * BOARD_SIZE + c);
            placed.push({ type, row, col, w, h, z });
            placedThis = true;
            break;
          }
        }
        if (placedThis) break;
      }
      if (!placedThis) { ok = false; break; }
    }
    if (ok) {
      const pieces = [];
      placed.forEach((p) => {
        pieces.push({ id: `dark-${p.type}`, type: p.type, owner: "dark", row: p.row, col: p.col, w: p.w, h: p.h, z: p.z });
        pieces.push({
          id: `light-${p.type}`,
          type: p.type,
          owner: "light",
          row: BOARD_SIZE - p.row - p.h,
          col: BOARD_SIZE - p.col - p.w,
          w: p.w,
          h: p.h,
          z: p.z,
        });
      });
      return pieces;
    }
  }
  return createInitialPieces(); // astronomically unlikely fallback
}

function cellsOf(piece) {
  const cells = [];
  for (let r = piece.row; r < piece.row + piece.h; r++) {
    for (let c = piece.col; c < piece.col + piece.w; c++) cells.push([r, c]);
  }
  return cells;
}

function getPieceAt(pieces, row, col) {
  return (
    pieces.find(
      (p) => row >= p.row && row < p.row + p.h && col >= p.col && col < p.col + p.w
    ) || null
  );
}

function rollBlock(piece, dir) {
  const { row, col, w, h, z } = piece;
  switch (dir) {
    case "E":
      return { ...piece, col: col + w, w: z, z: w };
    case "W":
      return { ...piece, col: col - z, w: z, z: w };
    case "S":
      return { ...piece, row: row + h, h: z, z: h };
    case "N":
      return { ...piece, row: row - z, h: z, z: h };
    default:
      return piece;
  }
}

function inBounds(piece) {
  return (
    piece.row >= 0 &&
    piece.col >= 0 &&
    piece.row + piece.h <= BOARD_SIZE &&
    piece.col + piece.w <= BOARD_SIZE
  );
}

function evaluateBlockLanding(pieces, candidate) {
  if (!inBounds(candidate)) return { legal: false, crushes: null };
  const hits = [];
  for (const [r, c] of cellsOf(candidate)) {
    const occupant = getPieceAt(pieces, r, c);
    if (occupant && occupant.id !== candidate.id && !hits.includes(occupant)) hits.push(occupant);
  }
  if (hits.length === 0) return { legal: true, crushes: null };
  if (hits.length === 1 && hits[0].type === "cabeza" && hits[0].owner !== candidate.owner) {
    return { legal: true, crushes: hits[0] };
  }
  return { legal: false, crushes: null };
}

function legalRolls(pieces, piece) {
  const out = {};
  for (const dir of ROLL_DIRS) {
    const candidate = rollBlock(piece, dir);
    const verdict = evaluateBlockLanding(pieces, candidate);
    if (verdict.legal) out[dir] = { candidate, crushes: verdict.crushes };
  }
  return out;
}

function legalCabezaSteps(pieces, piece) {
  const out = {};
  for (const [dir, [dr, dc]] of Object.entries(STEP_DIRS)) {
    const r = piece.row + dr;
    const c = piece.col + dc;
    if (r < 0 || c < 0 || r >= BOARD_SIZE || c >= BOARD_SIZE) continue;
    const occupant = getPieceAt(pieces, r, c);
    if (occupant && occupant.id !== piece.id) continue;
    out[dir] = { candidate: { ...piece, row: r, col: c }, crushes: null };
  }
  return out;
}

function legalMovesFor(pieces, piece) {
  return piece.type === "cabeza" ? legalCabezaSteps(pieces, piece) : legalRolls(pieces, piece);
}

function pairLog(entries) {
  const rows = [];
  let current = null;
  for (const entry of entries) {
    if (entry.player === "dark") {
      if (current) rows.push(current);
      current = { n: rows.length + 1, dark: entry, light: null };
    } else {
      if (!current) current = { n: rows.length + 1, dark: null, light: null };
      current.light = entry;
      rows.push(current);
      current = null;
    }
  }
  if (current) rows.push(current);
  return rows;
}

/* Same "not a move" check the game engine enforces in settleTurn — kept
   at module scope so both places read one definition, not two that
   could quietly drift apart. */
function sameState(a, b) {
  return a.row === b.row && a.col === b.col && a.w === b.w && a.h === b.h && a.z === b.z;
}

/* ------------------------------ AI --------------------------------- */
/* Everything below is pure — no React, no Three.js. It only knows the
   game through the same functions a human's clicks already go through
   (legalMovesFor, rollBlock's inverses via sameState). The one thing it
   has that a click doesn't is generateTurns: a human plays one step at
   a time and the UI chains them, but the AI has to evaluate a whole
   turn — 1 step, or 2 — before it can compare options against each
   other, so it needs the complete tree up front. */

const AI_WIN_SCORE = 1_000_000;
/* How many turns count as "the opening" for AI move-variety purposes —
   see openingJitter in AI_DIFFICULTY and findBestAiTurn. */
const AI_OPENING_TURNS = 6;

function opponentOf(player) {
  return player === "dark" ? "light" : "dark";
}

/* Can any of the opponent's blocks crush `owner`'s Cabeza THIS move,
   from this exact position? Factored out so both evaluatePosition's
   leaf scoring and minimaxSearch's tie-break (see below) share one
   definition rather than two copies that could drift apart. */
function cabezaInDanger(pieces, owner) {
  const cabeza = pieces.find((p) => p.type === "cabeza" && p.owner === owner);
  if (!cabeza) return true; // already gone — about as "in danger" as it gets
  const oppPlayer = opponentOf(owner);
  for (const p of pieces) {
    if (p.owner !== oppPlayer || p.type === "cabeza") continue;
    const moves = legalMovesFor(pieces, p);
    for (const dir in moves) {
      if (moves[dir].crushes && moves[dir].crushes.id === cabeza.id) return true;
    }
  }
  return false;
}

/* theme: a 0-1 "tension" reading of the current position, purely for
   the ambient hum's resonance rate (see audioRef.current.setTension) —
   never read by the AI or the rules. Combines, for each side's Cabeza:
   whether it's actually in danger of being crushed this move (full
   tension), a softer proximity-based ramp as any enemy piece merely
   gets physically closer (a rough, cheap proxy for "closer to being
   in danger" without a full move-legality lookahead), and how close it
   is to its own goal row ("about to win"). Takes the maximum across
   both sides and both conditions, since this is atmosphere for
   whoever's watching, not a per-player signal. */
function computeTension(pieces) {
  let tension = 0;
  ["dark", "light"].forEach((owner) => {
    const cabeza = pieces.find((p) => p.type === "cabeza" && p.owner === owner);
    if (!cabeza) {
      tension = 1; // already crushed — as tense as it gets
      return;
    }
    const oppPlayer = opponentOf(owner);

    const dangerNow = cabezaInDanger(pieces, owner) ? 1 : 0;
    let minDist = Infinity;
    pieces.forEach((p) => {
      if (p.owner !== oppPlayer || p.type === "cabeza") return;
      const d = Math.max(Math.abs(p.row - cabeza.row), Math.abs(p.col - cabeza.col));
      if (d < minDist) minDist = d;
    });
    const proximityTension = minDist === Infinity ? 0 : Math.max(0, 1 - minDist / 3);
    tension = Math.max(tension, dangerNow, proximityTension * 0.7);

    const distToGoal = Math.abs(GOAL_ROW[owner] - cabeza.row);
    const winTension = Math.max(0, 1 - distToGoal / 3);
    tension = Math.max(tension, winTension);
  });
  return Math.min(1, tension);
}

/* Every complete legal turn available to `player` from this position:
   one piece, either a single step/roll or two chained together,
   exactly mirroring what the UI itself allows (see PIECE_META.maxSteps
   and the commit logic in the component). Two-step chains that land
   back on the turn's own starting square and orientation are excluded
   here for the same reason the engine voids them live — see sameState
   — so the AI never wastes a search branch, let alone an actual turn,
   considering a move that isn't really a move. */
function generateTurns(pieces, player) {
  const turns = [];

  for (const piece of pieces) {
    if (piece.owner !== player) continue;
    const maxSteps = PIECE_META[piece.type].maxSteps;
    const firstMoves = legalMovesFor(pieces, piece);

    for (const [dir1, move1] of Object.entries(firstMoves)) {
      let afterStep1 = pieces.map((p) => (p.id === piece.id ? move1.candidate : p));
      if (move1.crushes) afterStep1 = afterStep1.filter((p) => p.id !== move1.crushes.id);

      const wins1 =
        !move1.crushes &&
        piece.type === "cabeza" &&
        move1.candidate.row === GOAL_ROW[piece.owner];
      const terminal1 = !!move1.crushes || wins1;

      // Stopping after this single step is always itself a complete,
      // valid candidate turn — a human can always choose "Stop here"
      // even when a second step would be available, and the AI needs
      // that same option on the table, not just the deepest chain.
      turns.push({
        pieceId: piece.id,
        dirs: [dir1],
        resultingPieces: afterStep1,
        crushes: !!move1.crushes,
        wins: wins1,
      });

      if (terminal1 || maxSteps < 2) continue;

      const secondMoves = legalMovesFor(afterStep1, move1.candidate);
      for (const [dir2, move2] of Object.entries(secondMoves)) {
        if (sameState(piece, move2.candidate)) continue; // net-zero round trip — not a real turn

        let afterStep2 = afterStep1.map((p) => (p.id === piece.id ? move2.candidate : p));
        if (move2.crushes) afterStep2 = afterStep2.filter((p) => p.id !== move2.crushes.id);

        turns.push({
          pieceId: piece.id,
          dirs: [dir1, dir2],
          resultingPieces: afterStep2,
          crushes: !!move2.crushes,
          wins:
            !move2.crushes &&
            piece.type === "cabeza" &&
            move2.candidate.row === GOAL_ROW[piece.owner],
        });
      }
    }
  }

  return turns;
}

/* Scores a position from `forPlayer`'s point of view — higher is
   better for them, regardless of whose turn it actually is. This is
   the part that's genuinely hand-tuned rather than derived, and the
   most likely thing to need adjusting once this is actually played
   against.

   `weights` layers optional positional terms on top of the base score
   (progress/mobility/crush-threat below always apply regardless).
   Every term under DEFAULT_EVAL_WEIGHTS defaults to 0 — meaning "off,
   evaluates identically to before this existed" — and only becomes
   live when a difficulty's config actually sets it, so a tier that
   doesn't ask for one of these behaves exactly as it did previously. */
const DEFAULT_EVAL_WEIGHTS = {
  blockAdvance: 0,
  turritoBonus: 0,
  wall: 0,
  centrality: 0,
};

function evaluatePosition(pieces, forPlayer, weights = DEFAULT_EVAL_WEIGHTS) {
  const oppPlayer = opponentOf(forPlayer);
  const myCabeza = pieces.find((p) => p.type === "cabeza" && p.owner === forPlayer);
  const oppCabeza = pieces.find((p) => p.type === "cabeza" && p.owner === oppPlayer);

  // A missing Cabeza means it was crushed on some earlier ply of the
  // search itself (not necessarily the position actually on screen).
  if (!myCabeza) return -AI_WIN_SCORE;
  if (!oppCabeza) return AI_WIN_SCORE;

  // Progress toward each side's own goal row — dominant term, since
  // reaching it wins outright regardless of anything else on the board.
  const myProgress = forPlayer === "dark" ? myCabeza.row : BOARD_SIZE - 1 - myCabeza.row;
  const oppProgress = oppPlayer === "dark" ? oppCabeza.row : BOARD_SIZE - 1 - oppCabeza.row;
  let score = (myProgress - oppProgress) * 12;

  // Mobility: total legal rolls/steps available across each side's
  // pieces right now. Cheap proxy for "how much flexibility does this
  // side actually have" — a block rolled into a dead corner is worth
  // less than its mere presence on the board suggests.
  let myMobility = 0;
  let oppMobility = 0;
  for (const p of pieces) {
    const count = Object.keys(legalMovesFor(pieces, p)).length;
    if (p.owner === forPlayer) myMobility += count;
    else oppMobility += count;
  }
  score += (myMobility - oppMobility) * 1.5;

  // Immediate threat: can any enemy block crush my Cabeza on its very
  // next move, from this exact position? A real search finds this
  // organically at enough depth, but folding it into the leaf score too
  // gives even a shallow (Easy-mode) search genuine defensive sense
  // rather than none at all.
  if (cabezaInDanger(pieces, forPlayer)) score -= 4000;

  /* Everything below is off unless a difficulty's config turns it on
     (see AI_DIFFICULTY). Mobility above already rewards "more legal
     moves than the opponent" in general, but it has no opinion on
     WHERE a piece sits or what it's actually accomplishing there —
     these terms are what give block development, infiltration, and
     blocking real positional value beyond raw move-count, so a search
     that weighs them doesn't just default to whichever move happens to
     advance the Cabeza's dominant progress term the most. */

  if (weights.blockAdvance || weights.turritoBonus) {
    // Block development: the same "rows advanced from home" idea the
    // Cabeza's progress term uses, applied to the other four pieces
    // too, so a block still sitting on the back row reads as a worse
    // position than the identical piece several rows forward — not
    // merely neutral, the way it does today. Turrito gets an extra
    // per-square rate on top of the base one: it's the one piece small
    // enough (1x1) to thread through gaps the bigger blocks can't, so
    // pushing it forward aggressively is worth more than the same
    // advance from Opa or Chato, not just as much.
    for (const p of pieces) {
      if (p.type === "cabeza") continue;
      const rowsAdvanced = p.owner === "dark" ? p.row : BOARD_SIZE - 1 - p.row;
      const rate = weights.blockAdvance + (p.type === "turrito" ? weights.turritoBonus : 0);
      score += (p.owner === forPlayer ? 1 : -1) * rowsAdvanced * rate;
    }
  }

  if (weights.wall) {
    // Corridor coverage, not proximity to the enemy Cabeza's CURRENT
    // square. An earlier version of this measured "is one of my
    // pieces near wherever the Cabeza happens to be standing right
    // now" — which rewards a piece for merely having already started
    // near the Cabeza's home square, and gives it no reason to move
    // once the Cabeza heads somewhere else, or worse, no reason to
    // move at all while the Cabeza hasn't committed a direction yet.
    // That's backwards: the danger of an open lane exists BEFORE a
    // Cabeza starts using it, not just once it's already standing in
    // it. This instead finds the WIDEST gap between my own blockers
    // across the full width of the corridor the enemy Cabeza still has
    // to cross (every row between its current one and its own goal
    // row — with no committed column yet, any of them is still fair
    // game). A three-column-wide hole on one edge costs real points
    // the moment it exists, regardless of whether anything has
    // actually walked into it yet.
    const corridorGap = (owner, enemyCabeza, enemyGoalRow) => {
      const inBand = (r) =>
        enemyGoalRow > enemyCabeza.row
          ? r >= enemyCabeza.row && r <= enemyGoalRow
          : r <= enemyCabeza.row && r >= enemyGoalRow;
      const cols = pieces
        .filter((p) => p.owner === owner && p.type !== "cabeza")
        .filter((p) => inBand(p.row + (p.h - 1) / 2))
        .map((p) => p.col + (p.w - 1) / 2)
        .sort((a, b) => a - b);
      const marks = [-1, ...cols, BOARD_SIZE];
      let gap = 0;
      for (let i = 1; i < marks.length; i++) gap = Math.max(gap, marks[i] - marks[i - 1] - 1);
      return gap; // 0 = fully covered, up toward BOARD_SIZE = wide open
    };
    const myGap = corridorGap(forPlayer, oppCabeza, GOAL_ROW[oppPlayer]);
    const oppGap = corridorGap(oppPlayer, myCabeza, GOAL_ROW[forPlayer]);
    // A gap of MINE is bad for me (subtracts); the SAME gap sitting on
    // the opponent's side is an opportunity for my own Cabeza to run
    // through, so it adds — this is what gives the term both a
    // defensive and an aggressive side, not just a defensive one.
    score += (oppGap - myGap) * weights.wall;
  }

  if (weights.centrality) {
    // Zone control: a central piece has more of the board reachable
    // from it than the same piece pinned against an edge or corner —
    // true for a block's roll directions and doubly true for the
    // Cabeza, whose diagonal options get clipped outright near a wall.
    const center = (BOARD_SIZE - 1) / 2;
    const maxDist = Math.hypot(center, center);
    let value = 0;
    for (const p of pieces) {
      const pr = p.row + (p.h - 1) / 2;
      const pc = p.col + (p.w - 1) / 2;
      const central = 1 - Math.hypot(pr - center, pc - center) / maxDist;
      value += (p.owner === forPlayer ? 1 : -1) * central;
    }
    score += value * weights.centrality;
  }

  return score;
}

/* Alpha-beta minimax over generateTurns. `player` is whoever moves at
   this node (alternates every ply); `aiPlayer` is fixed for the whole
   search and is who every leaf is scored for — maximizing when it's
   aiPlayer's node, minimizing at the opponent's. `deadline` is a
   performance.now() timestamp, checked before recursing so a search
   that's running long can bail out cleanly rather than run away.

   `rootBias`, when present, nudges which of several genuinely
   comparable turns get chosen right here at THIS decision — it is
   deliberately never forwarded into the recursive call below, so it
   only ever touches the AI's own actual choice, never how any
   hypothetical line further down the tree gets valued. That keeps
   tactics (spotting threats, following a winning line, etc.) exactly
   as sharp as before; it only shapes style at the root. It's also
   never allowed to outweigh survival: a turn that pulls `player`'s own
   Cabeza out of immediate danger is exempt from both bias terms below,
   the same way a genuine crush/win already was — a real game showed a
   two-step Cabeza escape (the only move that actually reached safety)
   losing out to a one-step move that merely LOOKED comparable once
   twoStepBias knocked it down, which is exactly backwards.

   Ties (not just comparable-but-distinct scores) get their own
   resolution too — see the tie-break below the main comparison. Two
   turns scoring EXACTLY the same is normal in a forced loss, where
   every remaining option shares the same terminal value; without an
   explicit tie-break, whichever turn happened to be generated first
   wins by pure iteration-order luck, which is how an already-doomed
   Cabeza could end up ignored in favor of an unrelated piece even
   though moving it changed nothing about the actual outcome.

   `weights` is different: it's genuine position evaluation (see
   evaluatePosition), not a style nudge, so it DOES thread through every
   recursive call below — using a different value system at different
   plies would make minimax's own comparisons incoherent. */
function minimaxSearch(pieces, player, aiPlayer, depth, alpha, beta, deadline, rootBias = null, weights = DEFAULT_EVAL_WEIGHTS) {
  if (performance.now() > deadline) {
    return { score: evaluatePosition(pieces, aiPlayer, weights), turn: null, timedOut: true };
  }

  const turns = generateTurns(pieces, player);
  if (turns.length === 0 || depth === 0) {
    return { score: evaluatePosition(pieces, aiPlayer, weights), turn: null, timedOut: false };
  }

  const maximizing = player === aiPlayer;

  /* Move ordering: crush/win turns first (unchanged — costs nothing
     extra, since generateTurns already flags these), THEN every
     remaining candidate ranked by a quick static evaluation of its own
     resulting position — the same evaluatePosition used at the leaves,
     just also called once up front to rank candidates before recursing
     into them, rather than only at the bottom of the tree. */
  const scoredTurns = turns.map((t) => ({
    turn: t,
    terminal: !!(t.crushes || t.wins),
    orderScore: t.crushes || t.wins ? 0 : evaluatePosition(t.resultingPieces, aiPlayer, weights),
  }));
  scoredTurns.sort((a, b) => {
    if (a.terminal !== b.terminal) return a.terminal ? -1 : 1;
    if (a.terminal) return 0; // both terminal -- no further ranking needed between them
    return maximizing ? b.orderScore - a.orderScore : a.orderScore - b.orderScore;
  });
  turns.splice(0, turns.length, ...scoredTurns.map((s) => s.turn));

  let bestScore = maximizing ? -Infinity : Infinity;
  let bestTurn = null;
  let timedOut = false;

  const dangerBeforeMove = rootBias ? cabezaInDanger(pieces, player) : false;

  for (const turn of turns) {
    let score;
    if (turn.crushes || turn.wins) {
      const sign = player === aiPlayer ? 1 : -1;
      score = sign * (AI_WIN_SCORE + depth);
    } else {
      const child = minimaxSearch(
        turn.resultingPieces,
        opponentOf(player),
        aiPlayer,
        depth - 1,
        alpha,
        beta,
        deadline,
        null,
        weights
      );
      score = child.score;
      if (child.timedOut) timedOut = true;

      if (rootBias) {
        const resolvesDanger = dangerBeforeMove && !cabezaInDanger(turn.resultingPieces, player);

        if (!resolvesDanger) {
          if (turn.dirs.length === 2) score -= rootBias.twoStepBias;

          const movedPiece = pieces.find((p) => p.id === turn.pieceId);
          if (movedPiece && movedPiece.type === "cabeza") {
            score -= rootBias.cabezaRepeatBias * rootBias.cabezaStreak;
          }
        }

        if (rootBias.jitter > 0 && Math.abs(score) < AI_WIN_SCORE) {
          score += (Math.random() * 2 - 1) * rootBias.jitter;
        }
      }
    }

    if (maximizing ? score > bestScore : score < bestScore) {
      bestScore = score;
      bestTurn = turn;
    } else if (score === bestScore && bestTurn) {
      const stayedSafe = !cabezaInDanger(turn.resultingPieces, player);
      const bestWasSafe = !cabezaInDanger(bestTurn.resultingPieces, player);
      if (stayedSafe && !bestWasSafe) {
        bestScore = score;
        bestTurn = turn;
      }
    }

    if (maximizing) alpha = Math.max(alpha, bestScore);
    else beta = Math.min(beta, bestScore);
    if (beta <= alpha) break; // prune — the rest of this branch can't change the outcome

    if (timedOut) break;
  }

  return { score: bestScore, turn: bestTurn, timedOut };
}

/* Iterative deepening: search depth 1, then 2, then 3… until either
   maxDepth or timeBudgetMs runs out. */
function findBestAiTurn(
  pieces,
  aiPlayer,
  {
    maxDepth,
    timeBudgetMs,
    twoStepBias = 0,
    cabezaRepeatBias = 0,
    blockAdvance = 0,
    turritoBonus = 0,
    wall = 0,
    centrality = 0,
    jitter = 0,
    openingJitter = 0,
  },
  cabezaStreak = 0,
  turnIndex = 0
) {
  const deadline = performance.now() + timeBudgetMs;
  const effectiveJitter = jitter + (turnIndex < AI_OPENING_TURNS ? openingJitter : 0);
  const rootBias =
    twoStepBias || cabezaRepeatBias || effectiveJitter
      ? { twoStepBias, cabezaRepeatBias, cabezaStreak, jitter: effectiveJitter }
      : null;
  const weights = { blockAdvance, turritoBonus, wall, centrality };
  let best = null;

  for (let depth = 1; depth <= maxDepth; depth++) {
    if (performance.now() > deadline) break;
    const result = minimaxSearch(pieces, aiPlayer, aiPlayer, depth, -Infinity, Infinity, deadline, rootBias, weights);
    if (result.timedOut && depth > 1) break;
    if (result.turn) best = result.turn;
    if (Math.abs(result.score) >= AI_WIN_SCORE) break; // forced win/loss found — deeper search can't change that
  }

  return best;
}

/* --------------------------- geometry ----------------------------- */

function pieceCenter(p) {
  return {
    x: (p.col + p.w / 2) * SQUARE_SIZE - OFF,
    y: (p.z * PIECE_SCALE) / 2,
    z: (p.row + p.h / 2) * SQUARE_SIZE - OFF,
  };
}

function restingY(p) {
  return PIECE_META[p.type].shape === "disc"
    ? (DISC_H * PIECE_SCALE) / 2
    : (p.z * PIECE_SCALE) / 2;
}

function makeRoundedBox(sx, sy, sz, radius, seg = 8) {
  const r = Math.min(radius, sx / 2 - 1e-4, sy / 2 - 1e-4, sz / 2 - 1e-4);
  const ix = sx / 2 - r;
  const iy = sy / 2 - r;
  const iz = sz / 2 - r;

  const us = [];
  const uq = [];
  for (let q = 0; q < 4; q++) {
    for (let k = 0; k <= seg; k++) {
      us.push((q * Math.PI) / 2 + (k / seg) * (Math.PI / 2));
      uq.push(q);
    }
  }
  const vs = [];
  const vh = [];
  for (let h = 0; h < 2; h++) {
    for (let k = 0; k <= seg; k++) {
      vs.push((h * Math.PI) / 2 + (k / seg) * (Math.PI / 2));
      vh.push(h);
    }
  }

  const pos = [];
  const nor = [];
  const uv = [];
  const idx = [];
  const W = us.length;
  const H = vs.length;

  for (let j = 0; j < H; j++) {
    const v = vs[j];
    const sgnY = vh[j] === 0 ? 1 : -1;
    for (let i = 0; i < W; i++) {
      const u = us[i];
      const q = uq[i];
      const nx = Math.sin(v) * Math.cos(u);
      const ny = Math.cos(v);
      const nz = Math.sin(v) * Math.sin(u);
      const sgnX = q === 0 || q === 3 ? 1 : -1;
      const sgnZ = q === 0 || q === 1 ? 1 : -1;
      pos.push(ix * sgnX + r * nx, iy * sgnY + r * ny, iz * sgnZ + r * nz);
      nor.push(nx, ny, nz);
      uv.push(i / (W - 1), 1 - j / (H - 1));
    }
  }
  for (let j = 0; j < H - 1; j++) {
    for (let i = 0; i < W; i++) {
      const i2 = (i + 1) % W;
      const a = j * W + i;
      const b = j * W + i2;
      const c = (j + 1) * W + i;
      const d = (j + 1) * W + i2;
      idx.push(a, b, c, b, d, c);
    }
  }

  const capT = [0, 1, 2, 3].map((q) => q * (seg + 1));
  const capB = [0, 1, 2, 3].map((q) => (H - 1) * W + q * (seg + 1));
  idx.push(capT[0], capT[2], capT[1], capT[0], capT[3], capT[2]);
  idx.push(capB[0], capB[1], capB[2], capB[0], capB[2], capB[3]);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  return geo;
}

function rayHitBoardPlaneY0(camY, camZ, dirY, dirZ) {
  if (dirY >= -1e-9) return dirZ >= 0 ? Infinity : -Infinity;
  const t = -camY / dirY;
  if (t < 0) return null;
  return camZ + t * dirZ;
}

function boardVerticalOverlapFraction(radius, phi, ty, halfFovRad) {
  const camY = ty + radius * Math.cos(phi);
  const camZ = radius * Math.sin(phi);
  const dY = -Math.cos(phi);
  const dZ = -Math.sin(phi);
  const cos = Math.cos(halfFovRad);
  const sin = Math.sin(halfFovRad);
  const nY = dY * cos - dZ * sin,
    nZ = dY * sin + dZ * cos;
  const fY = dY * cos + dZ * sin,
    fZ = -dY * sin + dZ * cos;
  const zNear = rayHitBoardPlaneY0(camY, camZ, nY, nZ);
  const zFar = rayHitBoardPlaneY0(camY, camZ, fY, fZ);
  if (zNear === null || zFar === null) return 0;
  const lo = Math.min(zNear, zFar);
  const hi = Math.max(zNear, zFar);
  const half = SLAB / 2;
  const overlap = Math.max(0, Math.min(half, hi) - Math.max(-half, lo));
  return overlap / SLAB;
}

function clampVerticalTarget(ty, radius, phi, halfFovRad, minFraction) {
  if (boardVerticalOverlapFraction(radius, phi, ty, halfFovRad) >= minFraction) return ty;
  let lo = 0,
    hi = ty;
  for (let i = 0; i < 24; i++) {
    const mid = (lo + hi) / 2;
    if (boardVerticalOverlapFraction(radius, phi, mid, halfFovRad) >= minFraction) lo = mid;
    else hi = mid;
  }
  return lo;
}

function pivotFor(piece, dir) {
  const { row, col, w, h, z } = piece;
  const S = PIECE_SCALE;
  const cx = (col + w / 2) * SQUARE_SIZE - OFF;
  const cz = (row + h / 2) * SQUARE_SIZE - OFF;
  const alongX = dir === "E" || dir === "W";
  const residual = ((SQUARE_SIZE - S) * ((alongX ? w : h) + z)) / 2;

  switch (dir) {
    case "E":
      return {
        point: new THREE.Vector3(cx + (w * S) / 2, 0, cz),
        axis: new THREE.Vector3(0, 0, 1),
        angle: -Math.PI / 2,
        dirVec: new THREE.Vector3(1, 0, 0),
        residual,
      };
    case "W":
      return {
        point: new THREE.Vector3(cx - (w * S) / 2, 0, cz),
        axis: new THREE.Vector3(0, 0, 1),
        angle: Math.PI / 2,
        dirVec: new THREE.Vector3(-1, 0, 0),
        residual,
      };
    case "S":
      return {
        point: new THREE.Vector3(cx, 0, cz + (h * S) / 2),
        axis: new THREE.Vector3(1, 0, 0),
        angle: Math.PI / 2,
        dirVec: new THREE.Vector3(0, 0, 1),
        residual,
      };
    case "N":
      return {
        point: new THREE.Vector3(cx, 0, cz - (h * S) / 2),
        axis: new THREE.Vector3(1, 0, 0),
        angle: -Math.PI / 2,
        dirVec: new THREE.Vector3(0, 0, -1),
        residual,
      };
    default:
      return null;
  }
}

function makeBoardTexture() {
  const RES = 2048;
  const canvas = document.createElement("canvas");
  canvas.width = RES;
  canvas.height = RES;
  const ctx = canvas.getContext("2d");
  const pxPerUnit = RES / SLAB;
  const pad = MARGIN * pxPerUnit;
  const squarePx = SQUARE_SIZE * pxPerUnit;

  ctx.fillStyle = COLORS.cream;
  ctx.fillRect(0, 0, RES, RES);

  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      const isGoal = r === 0 || r === BOARD_SIZE - 1;
      if (isGoal) {
        /* theme: a faint cyan wash instead of neutral gray — still the
           same functional marker (the two win-condition rows), just in
           the accent hue instead of a plain tint. */
        ctx.fillStyle = "rgba(77, 232, 255, 0.05)";
        ctx.fillRect(pad + c * squarePx, pad + r * squarePx, squarePx, squarePx);
      }
    }
  }

  /* theme: a very subtle radial vignette, purely a texture draw — gives
     the slab a faint sense of architectural depth (brighter center,
     darker toward the frame) without touching any geometry, raycasting,
     or the grid lines drawn as real 3D objects on top of this. */
  const vignette = ctx.createRadialGradient(RES / 2, RES / 2, RES * 0.2, RES / 2, RES / 2, RES * 0.72);
  vignette.addColorStop(0, "rgba(0,0,0,0)");
  vignette.addColorStop(1, "rgba(0,0,0,0.35)");
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, RES, RES);

  return new THREE.CanvasTexture(canvas);
}

/* A soft round falloff (opaque center fading smoothly to transparent)
   used to paint the weight-pulse squares as a diffuse bloom rather
   than a hard-edged rectangle — see pulseSquare. Generated once and
   shared, since it never needs to change per use. */
function makeSoftGlowTexture() {
  const RES = 256;
  const canvas = document.createElement("canvas");
  canvas.width = RES;
  canvas.height = RES;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createRadialGradient(RES / 2, RES / 2, 0, RES / 2, RES / 2, RES / 2);
  grad.addColorStop(0, "rgba(255,255,255,0.9)");
  grad.addColorStop(0.35, "rgba(255,255,255,0.4)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, RES, RES);
  return new THREE.CanvasTexture(canvas);
}

/* A blurred copy of the grid+border pattern, baked into a texture via
   canvas 2D's own shadowBlur (a genuine gaussian-ish blur around each
   stroke) rather than just raising a crisp line's opacity again. This
   is what gives the grid actual "bloom" — a soft halo around each
   line — without a real WebGL post-process bloom pass, which the
   plain UMD three.js build loaded here doesn't include. */
function makeGridGlowTexture() {
  const RES = 1024;
  const canvas = document.createElement("canvas");
  canvas.width = RES;
  canvas.height = RES;
  const ctx = canvas.getContext("2d");
  const pxPerUnit = RES / GRID_EXTENT;
  ctx.lineCap = "round";
  ctx.shadowColor = "#4de8ff";
  ctx.shadowBlur = 32.2; // +15% per feedback ("increase glow / bloom of ... lattice lines 15%")
  ctx.strokeStyle = "rgba(130,228,255,0.9775)";
  ctx.lineWidth = 2.53; // +15%
  for (let i = 0; i <= BOARD_SIZE; i++) {
    const p = i * SQUARE_SIZE * pxPerUnit;
    ctx.beginPath();
    ctx.moveTo(p, 0);
    ctx.lineTo(p, RES);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, p);
    ctx.lineTo(RES, p);
    ctx.stroke();
  }
  ctx.shadowBlur = 38;
  ctx.strokeStyle = "rgba(150,235,255,0.95)";
  ctx.lineWidth = 4;
  ctx.strokeRect(3, 3, RES - 6, RES - 6);
  return new THREE.CanvasTexture(canvas);
}

/* theme: a world-space shader decal was tried here to make grid lines
   show through every piece regardless of size (a real limitation of
   plain depth-compositing transparency on short, small-footprint
   pieces) — reverted per feedback: it sampled the grid pattern by
   world X/Z on every fragment regardless of which face it belonged
   to, so a piece's SIDE faces (spanning a range of Y at one X/Z
   column) picked up the flat top-down grid pattern too, reading as a
   constant wireframe embossed on/inside the piece rather than genuine
   see-through, and much more visible on dark pieces than light ones
   by sheer contrast. Pieces are plain, ordinary transparency again —
   see the material below. */

function makeGrid() {
  const group = new THREE.Group();
  const lines = [];

  for (let i = 0; i <= BOARD_SIZE; i++) {
    const p = i * SQUARE_SIZE - OFF;
    lines.push(p, 0, -OFF, p, 0, OFF);
    lines.push(-OFF, 0, p, OFF, 0, p);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(lines, 3));
  const gridLines = new THREE.LineSegments(
    geo,
    /* theme: additive blending is what actually reads as "glowing"
       against the dark board — brightness stacks where lines cross
       instead of just sitting at a flat alpha, which is the cheapest
       real glow available without a post-process bloom pass.
       depthWrite: false keeps the glow from fighting the grid's own
       later-drawn siblings (border, pieces) in the depth buffer. */
    new THREE.LineBasicMaterial({
      color: HEX.slate,
      transparent: true,
      opacity: 0.507, // +15%, then a further +5% per feedback ("increase all neon glow 5%")
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    })
  );
  gridLines.position.y = 0.004;
  /* theme: fixes a real bug reported as an "unexpected lighting
     continuity issue" when panning/rotating the camera with
     translucent pieces on the board. Three.js sorts same-renderOrder
     transparent objects by distance from camera, and this group's own
     bounding-sphere distance (the whole board, one object) versus any
     given piece's distance can flip which one is judged "farther" as
     the camera moves — when that flip happens, whichever object draws
     second changes, and since order affects the blended result, the
     piece's apparent brightness/grid visibility visibly jumps at that
     crossover, reading as a discontinuity rather than a smooth reveal.
     A fixed, negative renderOrder here (see also border/glow below)
     makes the whole grid group always draw before any piece
     regardless of distance, removing the flip entirely. */
  gridLines.renderOrder = -10;
  group.add(gridLines);

  const borderGeo = new THREE.BufferGeometry();
  borderGeo.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
      [
        -OFF, 0, -OFF, OFF, 0, -OFF,
        OFF, 0, -OFF, OFF, 0, OFF,
        OFF, 0, OFF, -OFF, 0, OFF,
        -OFF, 0, OFF, -OFF, 0, -OFF,
      ],
      3
    )
  );
  const border = new THREE.LineSegments(
    borderGeo,
    /* theme: the board's defining edge, in the neutral structural-glow
       color rather than solid ink — this is the one line most worth
       spending the "thin luminous edge" language on, so it also gets
       the additive treatment above. */
    new THREE.LineBasicMaterial({
      color: HEX.structureEdge,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    })
  );
  border.position.y = 0.006;
  border.renderOrder = -10; // see gridLines.renderOrder comment above
  group.add(border);

  /* theme: the actual bloom halo — a soft-blurred copy of the same
     pattern, sitting just above the crisp lines, additively blended so
     it only ever brightens, never obscures. */
  const glow = new THREE.Mesh(
    new THREE.PlaneGeometry(GRID_EXTENT, GRID_EXTENT),
    new THREE.MeshBasicMaterial({
      map: makeGridGlowTexture(),
      transparent: true,
      opacity: 0.7245, // +15%, then a further +5% per feedback ("increase all neon glow 5%")
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    })
  );
  glow.rotation.x = -Math.PI / 2;
  glow.position.y = 0.009;
  glow.renderOrder = -10; // see gridLines.renderOrder comment above
  group.add(glow);

  return group;
}

/* --------------------------- soundscape ----------------------------- */
/* A synthesized ambient bed (Web Audio API, no external assets) plus a
   sparse, randomized layer of "machine is alive" micro-events, plus a
   handful of short gameplay cues. Entirely isolated from game state —
   every call site below is a single fire-and-forget method call from
   an existing state transition (select, move, capture, win, camera
   zoom); nothing in here can read or change what actually happens on
   the board, and if Web Audio is unavailable the game stays fully
   playable, just silent.

   Autoplay policies require a user gesture before any audio can
   start, so ensureStarted() is idempotent and cheap to call from
   anywhere — it's wired to the first pointer-down on the board. */
function createSoundscape() {
  const MASTER_GAIN = Math.pow(10, 17 / 20); // +4dB, +10dB, then a further +3dB per feedback ("maximize the overall gain across every audio channel") — +17dB total, applied once at the final stage
  let ctx = null;
  let master = null; // overall output, respects mute
  let ambientGain = null; // hum + noise bed, scaled live by zoom
  let introGain = null; // 0->1 fade multiplier on the ambient bed only, see beginGameFadeIn
  let crackleGain = null; // silent until close to max zoom — see setZoom/startCrackle
  let crackleHissGain = null; // brown-noise bed under the crackle, same zoom curve at ~5% of its peak
  let eventsGain = null; // random micro-events
  let sfxGain = null; // gameplay cues — stays audible above the ambience
  let reverbNode = null; // short synthetic impulse, for the landing thud
  let cathedralReverb = null; // long synthetic impulse, built lazily for the choir stab only
  let choirMasterEnv = null; // the active choir stab's master gain, so an early close can cut it short
  let choirEndTime = 0; // ctx.currentTime at which the active choir stab naturally finishes
  let thudShaper = null; // crunch/distortion stage shared by landing thuds
  let muted = false;
  let started = false;
  let disposed = false;
  let windingDown = false; // true once a win fires — ambient schedulers stop re-arming, master gain fades to 0
  let wanderFn = null; // the hum's buzz-wander recursive step, stashed so resetWindDown can re-arm it after a win
  let grainFn = null; // the crackle's grain recursive step, stashed for the same reason
  let noiseBuffer = null;
  let brownNoiseBuffer = null;
  let scheduleTimer = null;
  let buzzWanderTimer = null;
  let crackleTimer = null;
  const recentEvents = [];
  // The hum's own "breathing" resonance LFOs — kept here so setTension
  // (see below) can speed them up live as a Cabeza gets closer to
  // danger or to winning, rather than only being set once at start.
  let humLfo1 = null;
  let humLfo2 = null;
  let humLfo1BaseFreq = 0;
  let humLfo2BaseFreq = 0;
  let tension = 0; // 0-1, settable before ensureStarted — applied once the hum actually starts

  const nowT = () => ctx.currentTime;

  function makeNoiseBuffer() {
    const len = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  /* Brown (red) noise via leaky integration of white noise — each
     sample is a damped running sum of the last, which biases energy
     toward the low end for a warmer, duller hiss than the white-noise
     buffer above. Re-gained afterward since integration collapses the
     raw amplitude a great deal. */
  function makeBrownNoiseBuffer() {
    const len = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      data[i] = last * 3.5;
    }
    return buf;
  }

  /* A short synthetic impulse response — decaying noise, not a
     recording — for a ConvolverNode. Gives a percussive hit a sense
     of a small, hard room around it ("short reverb") without needing
     any external audio asset. */
  function makeImpulse(duration, decay) {
    const len = Math.floor(ctx.sampleRate * duration);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  function noiseSource() {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer;
    src.loop = true;
    return src;
  }

  function brownNoiseSource() {
    const src = ctx.createBufferSource();
    src.buffer = brownNoiseBuffer;
    src.loop = true;
    return src;
  }

  /* Simple attack/hold/release envelope applied to a gain node. Every
     synthesized event below is built from this plus one or two
     oscillators/noise sources — the "simple components" the brief
     asks for, nothing sample-based. */
  function env(node, t0, attack, hold, release, peak) {
    node.gain.setValueAtTime(0, t0);
    node.gain.linearRampToValueAtTime(peak, t0 + attack);
    node.gain.setValueAtTime(peak, t0 + attack + hold);
    node.gain.linearRampToValueAtTime(0, t0 + attack + hold + release);
  }

  /* A tanh soft-clip curve for the events bus's WaveShaper — gentle at
     low amplitude, increasingly rounded near the extremes. This is
     what turns a clean synthesized click or sweep into something with
     a bit of analog grit/asymmetry instead of a pristine tone. */
  function makeSoftClipCurve(amount) {
    const n = 2048;
    const curve = new Float32Array(n);
    const k = Math.tanh(amount) || 1;
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      curve[i] = Math.tanh(x * amount) / k;
    }
    return curve;
  }

  function pan(node) {
    if (!ctx.createStereoPanner) return node;
    const p = ctx.createStereoPanner();
    // Biased toward the edges rather than dead center, so an event
    // reads as coming from somewhere in the room, not from the board
    // itself — "the environment feels larger than the visible board."
    p.pan.value = (Math.random() < 0.5 ? -1 : 1) * (0.25 + Math.random() * 0.6);
    node.connect(p);
    return p;
  }

  function startHum() {
    /* Two slightly detuned low oscillators through a lowpass filter —
       the transformer-like beating comes from the detune itself, not
       from any rhythmic modulation layered on top. */
    const humFilter = ctx.createBiquadFilter();
    humFilter.type = "lowpass";
    humFilter.frequency.value = 230; // opened slightly so the hum survives on speakers that roll off below ~150Hz
    const humGain = ctx.createGain();
    humGain.gain.value = 0.05;

    [55, 55.6].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = freq;
      const g = ctx.createGain();
      g.gain.value = i === 0 ? 1 : 0.55;
      osc.connect(g).connect(humFilter);
      osc.start();
    });

    /* An octave-down sub oscillator underneath — the deep, felt-more-
       than-heard foundation that's closer to Vangelis/Blade-Runner-era
       sub-bass than the mid-low hum alone gives. */
    const sub = ctx.createOscillator();
    sub.type = "sine";
    sub.frequency.value = 27.5;
    const subGain = ctx.createGain();
    subGain.gain.value = 0.6;
    sub.connect(subGain).connect(humFilter);
    sub.start();

    /* A very slow filter sweep on the hum's own tone color — distinct
       from the amplitude LFOs below, this one moves the lowpass cutoff
       itself, so the hum's timbre drifts warmer/brighter over a long,
       irregular cycle the way an analog pad slowly evolves rather than
       just getting louder/quieter. */
    const filterLfo = ctx.createOscillator();
    filterLfo.type = "sine";
    filterLfo.frequency.value = 1 / 47;
    const filterLfoGain = ctx.createGain();
    filterLfoGain.gain.value = 55;
    filterLfo.connect(filterLfoGain).connect(humFilter.frequency);
    filterLfo.start();

    /* Slow "breathing" on the hum's own level — two independent,
       slow LFOs (an irrational-ish ratio to each other) summed onto
       the same gain param, so two non-aligning cycles beat against
       each other over a very long span, which is what reads as
       "irregular" rather than a single, eventually-recognizable
       breathing rate.

       Per feedback, their baseline rate is now 40% slower again to
       start (33.75s / 48.25s, was 20.25s / 28.95s), but setTension
       (see the public API below) can speed both up live — toward
       roughly their pre-slowdown rate at full tension — as a Cabeza
       gets closer to being crushed or to winning. References and base
       frequencies are kept in the outer closure so setTension can
       reach them after this function returns. */
    const lfo1 = ctx.createOscillator();
    lfo1.type = "sine";
    humLfo1BaseFreq = 1 / 135; // doubled period again per feedback (was 1/67.5)
    lfo1.frequency.value = humLfo1BaseFreq;
    const lfo1Gain = ctx.createGain();
    lfo1Gain.gain.value = 0.009;
    lfo1.connect(lfo1Gain).connect(humGain.gain);
    lfo1.start();
    humLfo1 = lfo1;

    const lfo2 = ctx.createOscillator();
    lfo2.type = "sine";
    humLfo2BaseFreq = 1 / 193; // doubled period again per feedback (was 1/96.5)
    lfo2.frequency.value = humLfo2BaseFreq;
    const lfo2Gain = ctx.createGain();
    lfo2Gain.gain.value = 0.006;
    lfo2.connect(lfo2Gain).connect(humGain.gain);
    lfo2.start();
    humLfo2 = lfo2;

    applyTension(tension); // pick up any tension set before the hum existed

    humFilter.connect(humGain).connect(ambientGain);

    /* A faint band of filtered noise for circuitry hiss — turned down
       hard (was 0.004, now roughly a third of that) and, instead of
       sitting on one fixed band forever, its center frequency and
       level drift to a new random target on an irregular multi-second
       schedule, so the hiss itself has some life to it rather than
       reading as a static tone. Cut a further 30% per feedback (this
       is the ambient hiss, not the zoomed-in crackle's own separate
       hiss layer, which is untouched). */
    const buzz = noiseSource();
    const buzzFilter = ctx.createBiquadFilter();
    buzzFilter.type = "bandpass";
    buzzFilter.frequency.value = 1400;
    buzzFilter.Q.value = 0.6;
    const buzzGain = ctx.createGain();
    buzzGain.gain.value = 0.00091;
    buzz.connect(buzzFilter).connect(buzzGain).connect(ambientGain);
    buzz.start();

    const wander = () => {
      if (disposed || windingDown) return;
      const t0 = nowT();
      buzzFilter.frequency.setTargetAtTime(900 + Math.random() * 1800, t0, 2.5);
      buzzGain.gain.setTargetAtTime(0.00042 + Math.random() * 0.00112, t0, 2.5);
      buzzWanderTimer = setTimeout(wander, 5000 + Math.random() * 9000);
    };
    wanderFn = wander;
    buzzWanderTimer = setTimeout(wander, 4000 + Math.random() * 6000);
  }

  /* A continuous crackling-resonance layer, always running but held at
     zero gain until setZoom pushes it up near maximum zoom. Built from
     bright, highpassed noise whose amplitude is modulated by a SECOND,
     heavily-lowpassed noise source (a "random slow wander" used as an
     irregular envelope) rather than a smooth oscillator — that's what
     makes it read as crackle/sizzle rather than a tremolo effect. */
  /* Rebuilt from scratch — the previous version (continuous filtered
     noise under a slow amplitude wobble) just read as a smooth "shhhh"
     no matter how it was tuned, because a CONTINUOUS noise bed can't
     sound granular; only discrete, separately-triggered grains can.
     This is real granular synthesis instead: a self-perpetuating
     stream of very short, independently-filtered noise grains fired
     at irregular random gaps, each one a genuine little pop/burst/tick
     rather than a slice of a continuous hiss. Density, per-grain
     amplitude, and per-grain filter character are all randomized
     independently, which is what produces "uneven amplitude and
     frequency" rather than a uniform texture. The grain loop runs
     continuously once started; crackleGain (the zoom-driven gate, see
     setZoom) is what makes it silent or present, not the loop itself
     stopping. */
  function startCrackle() {
    crackleGain = ctx.createGain();
    crackleGain.gain.value = 0; // driven entirely by setZoom

    function grain() {
      if (disposed || windingDown) return;
      const t0 = nowT();
      const flavor = Math.random();
      const src = noiseSource();
      const filt = ctx.createBiquadFilter();
      let dur;
      if (flavor < 0.45) {
        // Sharp little pop / microscopic static arc: brief, bright,
        // narrow-band.
        filt.type = "bandpass";
        filt.frequency.value = 2200 + Math.random() * 4500;
        filt.Q.value = 3 + Math.random() * 5;
        dur = 0.00067 + Math.random() * 0.00133; // another 50% faster on top of the earlier 3x
      } else if (flavor < 0.8) {
        // Gritty/raspy burst: lower, rougher, a touch longer.
        filt.type = "bandpass";
        filt.frequency.value = 500 + Math.random() * 1400;
        filt.Q.value = 1.2 + Math.random() * 2.5;
        dur = 0.00133 + Math.random() * 0.00313;
      } else {
        // Rare dry crack: wideband, slightly longer, the loudest of
        // the three flavors — an occasional harder discharge among
        // the smaller grains.
        filt.type = "highpass";
        filt.frequency.value = 900 + Math.random() * 1200;
        dur = 0.0022 + Math.random() * 0.00313;
      }
      const g = ctx.createGain();
      // Near-instant attack, short irregular decay — a pop/tick shape,
      // never a swell. Amplitude randomized per grain (0.35-1x) for
      // genuinely uneven loudness grain-to-grain.
      const peak = (0.35 + Math.random() * 0.65) * (flavor >= 0.8 ? 1.4 : 1);
      env(g, t0, 0.0004, 0.0005, dur, peak);
      src.connect(filt).connect(g).connect(crackleGain);
      src.start(t0);
      src.stop(t0 + dur + 0.02);
      // Gap also 50% tighter again (on top of the earlier 3x cut) —
      // denser spacing plus the shorter grains above, per feedback
      // asking for another speed increase.
      crackleTimer = setTimeout(grain, 2.7 + Math.random() * 15.3);
    }
    grainFn = grain;
    grain();

    crackleGain.connect(ambientGain);

    /* A very faint, continuous brown-noise hiss underneath the crackle
       — warmer and duller than the white-noise grains, at roughly 5%
       of the crackle's own level (see setZoom, which drives both from
       the same exponential zoom curve so they rise and fall together).
       This is a bed, not a competing texture: it should be felt as
       warmth under the crackle more than heard as its own layer. */
    const hissSrc = brownNoiseSource();
    const hissFilt = ctx.createBiquadFilter();
    hissFilt.type = "lowpass";
    hissFilt.frequency.value = 900;
    crackleHissGain = ctx.createGain();
    crackleHissGain.gain.value = 0; // driven entirely by setZoom, alongside crackleGain
    hissSrc.connect(hissFilt).connect(crackleHissGain).connect(ambientGain);
    hissSrc.start();
  }

  /* ---- micro-events — each schedules one short, self-contained sound
     and lets it finish on its own; none of them hold a reference past
     their own envelope. ---- */
  function evTick() {
    /* A filtered noise click rather than a tuned oscillator — a square
       wave's strong harmonics are exactly what reads as a videogame
       "boop"; a narrow band of filtered noise reads as a tiny
       mechanical/electrical tick instead, with no clear pitch to latch
       onto. */
    const t0 = nowT();
    const src = noiseSource();
    const filt = ctx.createBiquadFilter();
    filt.type = "bandpass";
    filt.frequency.value = 1000 + Math.random() * 900;
    filt.Q.value = 1.2;
    const g = ctx.createGain();
    env(g, t0, 0.001, 0.003, 0.018, 0.016 + Math.random() * 0.012);
    src.connect(filt).connect(g);
    pan(g).connect(eventsGain);
    src.start(t0);
    src.stop(t0 + 0.04);
  }

  function evStatic() {
    const t0 = nowT();
    const src = noiseSource();
    const filt = ctx.createBiquadFilter();
    filt.type = "highpass";
    filt.frequency.value = 2500 + Math.random() * 3000;
    const g = ctx.createGain();
    const dur = 0.06 + Math.random() * 0.12;
    env(g, t0, 0.005, dur * 0.4, dur * 0.6, 0.02 + Math.random() * 0.012);
    src.connect(filt).connect(g);
    pan(g).connect(eventsGain);
    src.start(t0);
    src.stop(t0 + dur + 0.05);
  }

  function evPowerFluctuation() {
    const t0 = nowT();
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.value = 58 + Math.random() * 20;
    const g = ctx.createGain();
    env(g, t0, 0.01, 0.03, 0.12, 0.018);
    osc.connect(g);
    pan(g).connect(eventsGain);
    osc.start(t0);
    osc.stop(t0 + 0.22);
  }

  function evChirp() {
    /* Per feedback ("upward glissando... sounds like a stupid whoop in
       a Nintendo game... far more other-worldly & sinister"): the old
       version always multiplied frequency UPWARD every step, which is
       exactly the ascending-tone gesture that reads as a cheerful
       videogame power-up no matter how it's jittered/darkened. Rewired
